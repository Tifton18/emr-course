  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    background: #b91c1c; color: white; border-radius: 50%;

<script>

const FB_CONFIG = {
  apiKey:"AIzaSyBQGGn1JcsyVRuIovHhIMEm0q4kP48OjMw",
  authDomain:"class-attendance-72cd9.firebaseapp.com",
  projectId:"class-attendance-72cd9",
};
const EXAM_LABEL      = "Midterm Exam v2";
const EXAM_CATEGORY   = "midterm";
const TOTAL_TIME      = 50 * 60; // 50 minutes
const LETTERS         = ["A","B","C","D","E"];
 
// ── QUESTION DATA ────────────────────────────────────
const questions = [
  {section:"EMS Systems, EMR Role & Medical/Legal",type:"mc",stem:"Which of the following BEST describes 'scope of practice' for an EMR?",options:["The specific techniques an EMR may use at their own discretion","The medical procedures an EMR is legally authorized to perform based on training and state law","The number of patients an EMR may treat simultaneously","The geographic area in which an EMR may provide care"],correct:[1],explain:"Scope of practice defines the procedures, actions, and processes an EMR is legally permitted to perform based on their level of training and state or local protocols.",points:1},
  {section:"EMS Systems, EMR Role & Medical/Legal",type:"mc",stem:"A 16-year-old patient is involved in a car accident and is alone at the scene. She is conscious and able to communicate. Who may give consent for her treatment?",options:["She can consent for herself as the patient in need","Her parents or legal guardian must be contacted first","A bystander may give consent on her behalf","You may not treat her under any circumstances without parental consent"],correct:[0],explain:"Most states recognize that minors may consent to emergency care in the absence of a parent or guardian. Implied consent also applies if the patient is unable to communicate. An emancipated minor may always consent.",points:1},
  {section:"EMS Systems, EMR Role & Medical/Legal",type:"mc",stem:"Which of the following BEST distinguishes online medical direction from offline medical direction?",options:["Online = real-time voice contact with a physician; offline = standing orders and protocols","Online = written protocols only; offline = phone orders only","Online = hospital communication; offline = dispatch communication","Online = mandatory for all EMR calls; offline = optional guidance"],correct:[0],explain:"Online (direct) medical direction involves real-time communication with a physician during the call. Offline (indirect) medical direction includes standing orders, protocols, training, and quality improvement programs.",points:1},
  {section:"EMS Systems, EMR Role & Medical/Legal",type:"mc",stem:"An EMR finds a patient who has expressed a wish to die and refuses care. The patient is alert, oriented, and does not have a documented DNR. Which action is MOST appropriate?",options:["Respect the patient's wishes and leave the scene","Treat the patient under implied consent","Thoroughly document the refusal, ensure the patient is informed of risks, and contact medical direction or law enforcement per protocol","Physically restrain the patient to provide care"],correct:[2],explain:"A competent patient has the legal right to refuse care. The EMR must ensure the refusal is informed, document thoroughly, contact medical direction, and ensure the patient is safe. Physical restraint is not appropriate.",points:1},
  {section:"EMS Systems, EMR Role & Medical/Legal",type:"best2",stem:"Which TWO conditions are required for patient informed refusal of care to be legally valid?",options:["The patient must be oriented and demonstrate decision-making capacity","The patient must sign a waiver without hearing the risks","The patient must be informed of the risks of refusing care","The patient must be accompanied by a family member"],correct:[0,2],explain:"Valid informed refusal requires both that the patient has decision-making capacity and that they have been fully informed of the potential consequences of refusing care.",points:1},
  {section:"EMS Systems, EMR Role & Medical/Legal",type:"mc",stem:"Which of the following is an example of an EMR's duty to act?",options:["Providing off-duty first aid to a stranger at a restaurant","Responding to a call within your jurisdiction and service role","Volunteering at a community health fair","Assisting at a non-EMS public event"],correct:[1],explain:"Duty to act arises from the formal obligation created by your role — responding to dispatched calls within your jurisdiction is the clearest example of duty to act for an EMR.",points:1},
  {section:"EMS Systems, EMR Role & Medical/Legal",type:"mc",stem:"Documentation of a patient care report serves which of the following PRIMARY legal purposes?",options:["Proves that care was provided and what care was given","Protects the hospital from liability","Provides a marketing record for the EMS agency","Establishes the patient's billing information"],correct:[0],explain:"The PCR is a legal document that serves as the official record of the patient encounter — what was found, what was done, and patient response. It is the primary defense in legal actions.",points:1},
  {section:"EMS Systems, EMR Role & Medical/Legal",type:"matching",stem:"Match each EMS legal or ethical concept with its correct definition.",pairs:[{term:"Expressed consent",def:"Verbal or written agreement by a competent adult to receive treatment"},{term:"Implied consent",def:"Legal assumption that an unconscious patient would agree to life-saving care"},{term:"Abandonment",def:"Ending care without transferring to an equally or more qualified provider"},{term:"Battery",def:"Touching or treating a patient without their consent"},{term:"Proximate cause",def:"Direct causal link between the EMR's action or inaction and patient harm"}],points:1},
  {section:"Anatomy, Physiology & Medical Terminology",type:"mc",stem:"Which of the following correctly describes the function of the alveoli?",options:["Filter blood before it reaches the heart","Allow gas exchange between air and pulmonary capillaries","Produce mucus to trap pathogens in the airway","Regulate the rate of breathing via chemoreceptors"],correct:[1],explain:"The alveoli are microscopic air sacs where gas exchange occurs — oxygen diffuses into pulmonary capillaries and CO2 diffuses out into the alveolar air for exhalation.",points:1},
  {section:"Anatomy, Physiology & Medical Terminology",type:"mc",stem:"A patient is described as being in a 'fowler's position.' This means they are:",options:["Lying flat on their back","Lying on their left side","Seated at a 45-90 degree angle","Lying face down"],correct:[2],explain:"Fowler's position refers to a semi-recumbent position with the upper body elevated at 45-90 degrees. High Fowler's is approximately 90 degrees (sitting upright).",points:1},
  {section:"Anatomy, Physiology & Medical Terminology",type:"mc",stem:"The term 'diaphoresis' refers to:",options:["Difficulty breathing","Profuse sweating","Abnormal dilation of the pupils","Rapid heart rate"],correct:[1],explain:"Diaphoresis means profuse sweating, often seen in patients with AMI, shock, hypoglycemia, or severe pain.",points:1},
  {section:"Anatomy, Physiology & Medical Terminology",type:"mc",stem:"Which of the following correctly describes stroke volume?",options:["The total blood volume in the body","The amount of blood ejected by the heart with each contraction","The speed at which the heart contracts","The pressure in the arteries during cardiac relaxation"],correct:[1],explain:"Stroke volume is the amount of blood pumped out of the left ventricle with each heartbeat. Cardiac output = stroke volume × heart rate.",points:1},
  {section:"Anatomy, Physiology & Medical Terminology",type:"mc",stem:"The carpals are bones of the:",options:["Foot","Wrist","Shoulder","Knee"],correct:[1],explain:"The carpals are the eight small bones forming the wrist. The tarsals form the ankle and hindfoot.",points:1},
  {section:"Anatomy, Physiology & Medical Terminology",type:"mc",stem:"Which of the following BEST explains why blood pressure may remain normal in early hemorrhagic shock?",options:["The body produces extra blood cells to compensate","Compensatory vasoconstriction and tachycardia maintain pressure despite volume loss","Blood pressure monitors are inaccurate during active bleeding","The remaining blood becomes more concentrated, maintaining pressure"],correct:[1],explain:"In compensated shock, the sympathetic nervous system causes vasoconstriction and increases heart rate to maintain blood pressure. Hypotension is a late, decompensated sign.",points:1},
  {section:"Anatomy, Physiology & Medical Terminology",type:"best2",stem:"Which TWO of the following correctly describe the function of the autonomic nervous system in an emergency response?",options:["Parasympathetic activation increases heart rate and dilates pupils","Sympathetic activation releases epinephrine and norepinephrine, increasing heart rate and redirecting blood flow","Sympathetic activation causes bronchodilation and increases blood glucose","Parasympathetic activation causes vasoconstriction and decreases urine output"],correct:[1,2],explain:"Sympathetic (fight-or-flight) activation releases catecholamines, increases HR, causes bronchodilation, increases blood glucose, and redirects blood to vital organs. Parasympathetic is the rest-and-digest system.",points:1},
  {section:"Anatomy, Physiology & Medical Terminology",type:"matching",stem:"Match each medical prefix or suffix with its correct meaning.",pairs:[{term:"Hypo-",def:"Below normal or deficient"},{term:"-pnea",def:"Breathing"},{term:"Tachy-",def:"Fast"},{term:"-ology",def:"Study of"},{term:"Hemo-",def:"Relating to blood"}],points:1},
  {section:"Lifting, Moving & Patient Positioning",type:"mc",stem:"Which of the following BEST describes when a scoop stretcher is MOST appropriate?",options:["Moving a patient from a car to a gurney","Splitting around a patient and lifting them from the ground with minimal lateral movement","Carrying a patient down stairs","Moving an ambulatory patient with a leg injury"],correct:[1],explain:"A scoop stretcher separates into two halves that are placed under the patient from each side, allowing lifting with minimal lateral movement. It is ideal for trauma patients on the ground.",points:1},
  {section:"Lifting, Moving & Patient Positioning",type:"mc",stem:"A bariatric patient weighing 400 lbs needs to be moved from a second-floor apartment. Which resource consideration is MOST important?",options:["Request a larger ambulance only","Request additional personnel and bariatric equipment before attempting the move","Use standard stretcher — it is designed for heavy loads","Move the patient in a chair down the stairs to save time"],correct:[1],explain:"Bariatric patients require additional personnel (typically 6+), bariatric stretchers, and pre-planning. Attempting to move with standard equipment and insufficient personnel is a leading cause of EMR back injuries.",points:1},
  {section:"Lifting, Moving & Patient Positioning",type:"mc",stem:"Which patient should be transported in the left lateral recumbent (recovery) position?",options:["A patient with suspected cardiac chest pain","A patient with hypotension and suspected hypovolemia","A pregnant patient in the third trimester with altered mental status","A patient with a suspected femur fracture"],correct:[2],explain:"Pregnant patients beyond 20 weeks should be positioned on their left side to prevent the gravid uterus from compressing the inferior vena cava and reducing venous return, which causes supine hypotensive syndrome.",points:1},
  {section:"Airway Management",type:"mc",stem:"You are sizing an NPA for an adult patient. The CORRECT measurement is from the:",options:["Corner of the mouth to the earlobe","Tip of the nose to the earlobe","Center of the mouth to the chin","Nostril to the corner of the mouth"],correct:[1],explain:"An NPA is sized from the tip of the nose to the earlobe. An OPA is sized from the corner of the mouth to the earlobe.",points:1},

// ── SHUFFLE ──────────────────────────────────────────
function shuffle(arr) { return [...arr].sort(() => Math.random()-0.5); }
function initShuffles() {
  questions.forEach((q,i) => {
    if (q.type === "matching") shuffledDefs[i] = shuffle(q.pairs.map(p=>p.def));
  });
}
 
// ── SCORING ──────────────────────────────────────────
function scoreQuestion(q, ans) {
  if (ans === undefined || ans === null) return false;
  if (q.type === "mc")      return Array.isArray(ans) && ans[0] === q.correct[0];
  if (q.type === "best2")   return Array.isArray(ans) && ans.length===2 && ans.every(a=>q.correct.includes(a));
  if (q.type === "build") {
    const order = Array.isArray(ans) ? ans : [...Array(q.items.length).keys()];
    return order.length === q.order.length && order.every((v,j) => v === q.order[j]);
  }
  if (q.type === "matching") return Array.isArray(ans) && q.pairs.every((p,ti)=>ans[ti]===p.def);
  return false;
}
function calcScore() {
  let score=0, total=0;
  questions.forEach((q,i)=>{ total+=q.points; if(scoreQuestion(q,answers[i])) score+=q.points; });
  return {score,total};
}
 
// ── SAVE MATCHING ANS ────────────────────────────────
function saveMatchingAnswers(qIdx) {
  const q = questions[qIdx];
  answers[qIdx] = q.pairs.map((_,ti)=>matchSels[`${qIdx}-${ti}`]||null);
}
 
// ── TIMER ────────────────────────────────────────────
function startTimer() {
  startTime = Date.now();
  timerInterval = setInterval(()=>{
    timeLeft--;
    updateTimerUI();
    if (timeLeft <= 0) { clearInterval(timerInterval); finishExam(); }
  }, 1000);
}
function updateTimerUI() {
  const m = Math.floor(timeLeft/60), s = timeLeft%60;
  const str = `${m}:${String(s).padStart(2,"0")}`;
  const color = timeLeft<60?"#ef4444":timeLeft<180?"#b45309":"#22c55e";
  document.querySelectorAll(".timer-text").forEach(el=>{ el.textContent=str; el.style.color=color; });
  document.querySelectorAll(".timer-dot").forEach(el=>{ el.style.background=color; el.classList.toggle("pulse",timeLeft<60); });
  document.querySelectorAll(".timer-bar-fill").forEach(el=>{ el.style.width=`${(timeLeft/TOTAL_TIME)*100}%`; el.style.background=color; });
}
 
// ── SUBMIT TO GOOGLE SHEETS ──────────────────────────
// Uses GET with ?payload= because Apps Script cross-origin POST is blocked
// by CORS preflight. GET requests follow the redirect and reach doGet().
async function submitToFirebase(subData) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 15000);
  try {
    const url = `https://firestore.googleapis.com/v1/projects/${FB_CONFIG.projectId}/databases/(default)/documents/examResults`;
    const answersStr = JSON.stringify(subData.answersData, (k,v) => v === undefined ? null : v);
    const body = {
      fields: {
        examLabel:  {stringValue: subData.examLabel},
        category:   {stringValue: EXAM_CATEGORY},
        name:       {stringValue: subData.name},
        score:      {integerValue: String(isNaN(subData.score)    ? 0 : subData.score)},
        total:      {integerValue: String(isNaN(subData.total)    ? 0 : subData.total)},
        pct:        {integerValue: String(isNaN(subData.pct)      ? 0 : subData.pct)},
        timeUsed:   {integerValue: String(isNaN(subData.timeUsed) ? 0 : subData.timeUsed)},
        submittedAt:{stringValue: subData.submittedAt},
        answersData:{stringValue: answersStr},
      }
    };
    const resp = await fetch(url + `?key=${FB_CONFIG.apiKey}`, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(body),
      signal: controller.signal,
    });
    clearTimeout(timeout);
    if (!resp.ok) { const errText = await resp.text(); throw new Error(errText); }
    return { success: true };
  } catch(e) {
    clearTimeout(timeout);
    console.error("Firebase submit error:", e);
    return { success: false, error: e.toString() };
  }
}
 
// ── FINISH EXAM ──────────────────────────────────────
async function finishExam() {
  clearInterval(timerInterval);
  const {score,total} = calcScore();
  const pct = Math.round((score/total)*100);
  const timeUsed = TOTAL_TIME - timeLeft;
  const questionResults = questions.map((q,i)=>scoreQuestion(q,answers[i]));
 
  const answersData = questions.map((q, i) => {
    const given = answers[i] !== undefined ? answers[i] : null;
    const correct = q.correct !== undefined ? q.correct
                  : q.order   !== undefined ? q.order
                  : q.pairs   !== undefined ? q.pairs.map(p => p.def)
                  : null;
    return { given, correct };
  });
  const subData = {
    examLabel: EXAM_LABEL,
    name: studentName,
    score, total, pct, timeUsed,
    answersData,
    submittedAt: new Date().toISOString(),
  };
 
  phase = "submitting";
  render();

  try {
    const result = await submitToFirebase(subData);
    window._submitResult = result;
  } catch(e) {
    console.error('finishExam error:', e);
    window._submitResult = { success: false, error: e.toString() };
  }
  phase = "results";
  window._examScore = {score,total,pct};
  window._questionResults = questionResults;
  render();
}

        <div class="results-hero">
          <div class="results-icon">${passed?"✓":"✗"}</div>
          <div class="results-name">${studentName}</div>
          <div class="results-pct">${pct}%</div>
          <div class="results-verdict" style="color:${passed?"#81c784":"#ef9a9a"}">${passed?"PASSED":"DID NOT PASS"}</div>
          <div class="results-detail">${score} / ${total} points · Passing score: 70% (${Math.ceil(total*0.7)} pts)</div>
        </div>
        <div class="results-card">
          <div class="results-card-title">Question Review</div>
          ${reviewRows}
        </div>
      </div>
    </div>`;
}
 
function renderExam() {
  const q = questions[current];
  const sc = SECTION_COLORS[q.section] || {bg:"#1a1a2e",accent:"#b91c1c"};
  const progress = ((current+1)/questions.length)*100;
  const ans = answers[current] || [];
 
  let questionBody = "";
  if (q.type==="mc" || q.type==="best2") {
    const hint = q.type==="best2"
      ? `<div class="best2-hint">★ Select the TWO best answers ${ans.length>0?"("+ans.length+"/2 selected)":""}</div>` : "";
    const opts = q.options.map((opt,idx)=>{
      const sel = ans.includes(idx);
      return `<button class="option-btn ${q.type==="best2"?"best2":""} ${sel?"selected":""}" data-idx="${idx}">
        <div class="option-indicator">${LETTERS[idx]}</div>
        <div class="option-text">${opt}</div>
      </button>`;
    }).join("");
    questionBody = `<div class="options-list">${hint}${opts}</div>`;
 
  } else if (q.type==="matching") {
    const defs = shuffledDefs[current] || q.pairs.map(p=>p.def);
    const usedDefs = new Set(Object.entries(matchSels).filter(([k])=>k.startsWith(current+"-")).map(([,v])=>v));
    const bankDefs = defs.filter(d=>!usedDefs.has(d));
 
    const bankChips = bankDefs.map(def=>`<div class="def-chip" draggable="true" data-def="${encodeURIComponent(def)}">${def}</div>`).join("") ||
      `<div class="def-bank-empty">All definitions assigned</div>`;
 
    const termRows = q.pairs.map((pair,ti)=>{
      const assigned = matchSels[`${current}-${ti}`];
      return `
        <div class="term-row ${assigned?"assigned":""}" data-term-idx="${ti}">
          <div class="term-name"><span>${pair.term}</span></div>
          <div class="term-drop">
            ${assigned
              ? `<div class="def-chip" draggable="true" data-def="${encodeURIComponent(assigned)}" data-from-term="${ti}" style="margin:0;width:100%">${assigned}</div>`
              : `<span class="term-placeholder">— drag a definition here —</span>`}
          </div>
        </div>`;
    }).join("");
 
    questionBody = `
      <div class="match-instructions"><strong>Drag</strong> a definition from the bank and <strong>drop</strong> it onto the matching term. Drag a placed definition back to the bank to unassign it.</div>
      <div class="bank-label">Definition Bank</div>
      <div class="def-bank" id="defBank">${bankChips}</div>
      <div class="terms-label">Terms — Drop definitions here</div>
      <div class="term-rows">${termRows}</div>`;

  } else if (q.type==="build") {
    const currentOrder = answers[current] || [...Array(q.items.length).keys()];
    const listItems = currentOrder.map((itemIdx, pos) => `
      <div class="build-item" data-pos="${pos}" data-item-idx="${itemIdx}" draggable="true">
        <div class="build-handle">⠿</div>
        <div class="build-num">${pos+1}</div>
        <div class="build-text">${q.items[itemIdx]}</div>
      </div>`).join("");
    questionBody = `
      <div class="build-instructions"><strong>Drag</strong> the steps into the correct order — first action at the top, last at the bottom.</div>
      <div class="build-list" id="buildList">${listItems}</div>`;
  }
 
  const typeBadge = q.type==="build"
    ? `<span class="q-badge q-badge-build">ORDER STEPS</span>`
    : q.type==="best2"
    ? `<span class="q-badge" style="background:#7c3aed22;color:#a78bfa;border:1px solid #7c3aed44">SELECT 2</span>` : "";
 
  const dots = questions.map((_,i)=>
    `<div class="dot ${i===current?"current":answers[i]?"answered":""}" style="width:${i===current?20:10}px" data-dot="${i}"></div>`
  ).join("");
 
  const navRight = current < questions.length-1
    ? `<button class="btn-next" id="nextBtn">Next →</button>`
    : `<button class="btn-submit-exam" id="submitExamBtn">Submit Exam</button>`;
 
  return `
    <div>
      <div class="topbar">
        <div class="topbar-inner">
          <div class="progress-wrap">
            <div class="progress-bar"><div class="progress-fill" style="width:${progress}%;background:${sc.accent}"></div></div>
            <span class="progress-text">${current+1} / ${questions.length}</span>
          </div>
          <div class="timer-box" style="border-color:#1e2a3a">
            <div class="timer-dot" style="background:#22c55e"></div>
            <span class="timer-text" style="color:#22c55e">25:00</span>
          </div>
          <button class="btn-submit-top" id="submitTopBtn" style="background:${sc.accent}">Submit</button>
        </div>
        <div class="timer-bar"><div class="timer-bar-fill" style="width:100%;background:#22c55e"></div></div>
      </div>
 
      <div class="exam-wrap">
        <div class="section-badge" style="background:${sc.bg}">
          <div class="section-dot" style="background:${sc.accent}"></div>
          <span class="section-label" style="color:${sc.accent}">${q.section}</span>
        </div>
 
        <div class="q-header">
          <span class="q-label">QUESTION</span>
          <span class="q-number">${current+1}</span>
          ${typeBadge}
          <span class="q-points">${q.points} pt</span>
        </div>
 
        <div class="q-stem">${q.stem}</div>
        ${questionBody}
 
        <div class="nav-bar">
          <button class="btn-prev" id="prevBtn" ${current===0?"disabled":""}>← Previous</button>
          <div class="dots">${dots}</div>
          ${navRight}
        </div>
      </div>
    </div>`;
}
 
// ── EVENT BINDING ────────────────────────────────────
function attachEvents() {
  // INTRO
  const nameInput = document.getElementById("nameInput");
  const beginBtn  = document.getElementById("beginBtn");
  if (nameInput) {
    nameInput.value = studentName;
    nameInput.addEventListener("input", e=>{
      studentName = e.target.value.trim();
      nameInput.classList.toggle("has-value", !!studentName);
      beginBtn.disabled = !studentName;
      beginBtn.classList.toggle("active", !!studentName);
    });
    nameInput.addEventListener("keydown", e=>{ if(e.key==="Enter"&&studentName) beginExam(); });
  }
  if (beginBtn) {
    beginBtn.classList.toggle("active", !!studentName);
    beginBtn.addEventListener("click", ()=>{ if(studentName) beginExam(); });
  }
 
  // EXAM — MC / Best2
  document.querySelectorAll(".option-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const idx = parseInt(btn.dataset.idx);
      const q = questions[current];
      if (q.type==="mc") {
        answers[current] = [idx];
      } else {
        const prev = answers[current] || [];
        if (prev.includes(idx)) answers[current] = prev.filter(i=>i!==idx);
        else if (prev.length<2) answers[current] = [...prev,idx];
        else answers[current] = [prev[1],idx];
      }
      render();
    });
  });
 
  // EXAM — Matching drag & drop
  let draggingEl = null;
  document.querySelectorAll(".def-chip").forEach(chip=>{
    chip.addEventListener("dragstart", e=>{
      draggingEl = chip;
      chip.classList.add("dragging");
      const def = decodeURIComponent(chip.dataset.def);
      const fromTerm = chip.dataset.fromTerm !== undefined ? parseInt(chip.dataset.fromTerm) : null;
      dragData = {def, fromTermIdx: fromTerm};
      e.dataTransfer.effectAllowed = "move";
    });
    chip.addEventListener("dragend", ()=>{ chip.classList.remove("dragging"); draggingEl = null; });
  });
 
  // Drop on term rows
  document.querySelectorAll(".term-row").forEach(row=>{
    row.addEventListener("dragover", e=>{ e.preventDefault(); row.classList.add("dragover"); });
    row.addEventListener("dragleave", ()=>row.classList.remove("dragover"));
    row.addEventListener("drop", e=>{
      e.preventDefault(); row.classList.remove("dragover");
      if (!dragData) return;
      const termIdx = parseInt(row.dataset.termIdx);
      const {def, fromTermIdx} = dragData; dragData = null;
      // Remove from old slot
      if (fromTermIdx !== null && fromTermIdx !== undefined) delete matchSels[`${current}-${fromTermIdx}`];
      // Remove any slot that had this def
      Object.keys(matchSels).forEach(k=>{ if(matchSels[k]===def) delete matchSels[k]; });
      matchSels[`${current}-${termIdx}`] = def;
      saveMatchingAnswers(current);
      render();
    });
  });
 
  // Drop on bank (return)
  const bank = document.getElementById("defBank");
  if (bank) {
    bank.addEventListener("dragover", e=>{ e.preventDefault(); bank.classList.add("dragover"); });
    bank.addEventListener("dragleave", ()=>bank.classList.remove("dragover"));
    bank.addEventListener("drop", e=>{
      e.preventDefault(); bank.classList.remove("dragover");
      if (!dragData) return;
      const {fromTermIdx} = dragData; dragData = null;
      if (fromTermIdx !== null && fromTermIdx !== undefined) {
        delete matchSels[`${current}-${fromTermIdx}`];
        saveMatchingAnswers(current);
        render();
      }
    });
  }
 
  // NAV
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const submitExamBtn = document.getElementById("submitExamBtn");
  const submitTopBtn  = document.getElementById("submitTopBtn");
 
  if (prevBtn) prevBtn.addEventListener("click", ()=>{ if(current>0){ current--; render(); }});
  if (nextBtn) nextBtn.addEventListener("click", ()=>{ if(current<questions.length-1){ current++; render(); }});
  if (submitExamBtn) submitExamBtn.addEventListener("click", finishExam);
  if (submitTopBtn)  submitTopBtn.addEventListener("click",  finishExam);
 
  // Dot nav
  document.querySelectorAll(".dot").forEach(dot=>{
    dot.addEventListener("click", ()=>{ current=parseInt(dot.dataset.dot); render(); });
  });
 
  // Update timer display immediately
  updateTimerUI();
}
 
function beginExam() {
  initShuffles();
  phase = "exam";
  render();
  startTimer();
}
 
// ── BOOT ─────────────────────────────────────────────
document.addEventListener("DOMContentLoaded", ()=>{
  document.getElementById("root").innerHTML = "";
  render();
});
</script>
 
<div id="root"></div>
</body>
</html>
