};
const EXAM_LABEL      = "Week 1 Exam v2";
const EXAM_CATEGORY   = "module";
const TOTAL_TIME      = 25 * 60; // 25 minutes
const LETTERS         = ["A","B","C","D","E"];
 
// ── QUESTION DATA ────────────────────────────────────
const questions = [
  {section:"EMS Systems, EMR Role & Medical/Legal",type:"mc",stem:"A 45-year-old male is unconscious following a car accident. No family is present. Under which legal doctrine may you provide care without expressed consent?",options:["Expressed consent","Informed consent","Implied consent","Involuntary consent"],correct:[2],explain:"Implied consent assumes an unconscious or incapacitated patient would consent to life-saving care if they were able to do so.",points:1},
  {section:"EMS Systems, EMR Role & Medical/Legal",type:"mc",stem:"Which of the following BEST describes the EMR's scope of practice in Georgia?",options:["EMRs may perform all interventions that paramedics perform if supervised","EMRs provide immediate life-saving interventions using basic equipment until higher-level care arrives","EMRs may independently transport patients to the hospital","EMRs must obtain a physician's order before providing any patient care"],correct:[1],explain:"EMRs are trained to provide immediate basic life-saving care using minimal equipment until more advanced EMS resources arrive.",points:1},
  {section:"EMS Systems, EMR Role & Medical/Legal",type:"mc",stem:"A DNR order has been verified for your patient who is now in cardiac arrest. Which action is MOST appropriate?",options:["Begin CPR regardless, as the scene may be unsafe","Withhold CPR and contact medical direction or law enforcement as required by protocol","Attempt resuscitation until an AED is applied","Contact the patient's family to confirm the DNR before withholding care"],correct:[1],explain:"A valid DNR order must be honored. The appropriate response is to withhold resuscitation, provide comfort measures, and notify medical direction or law enforcement per local protocol.",points:1},
  {section:"EMS Systems, EMR Role & Medical/Legal",type:"mc",stem:"You are documenting a patient care encounter. Which of the following is the MOST important principle of patient care documentation?",options:["Use abbreviations whenever possible to save time","Document only the information the receiving facility needs to know","Record findings objectively, accurately, and completely at the time of the call","Correct errors by completely crossing them out with multiple lines"],correct:[2],explain:"Documentation must be objective, accurate, and completed as close to the time of care as possible. Errors should be corrected with a single line through the error, initials, and the correct information.",points:1},
  {section:"EMS Systems, EMR Role & Medical/Legal",type:"mc",stem:"Which action by an EMR MOST clearly constitutes a breach of patient confidentiality?",options:["Sharing patient information with the receiving hospital nurse","Discussing a patient's condition with a family member present at the scene","Telling a coworker unrelated to the call about a patient's diagnosis at the fire station","Documenting the patient's chief complaint in the patient care report"],correct:[2],explain:"Patient information may only be shared on a need-to-know basis with those directly involved in the patient's care. Discussing protected health information with uninvolved coworkers violates HIPAA.",points:1},
  {section:"EMS Systems, EMR Role & Medical/Legal",type:"mc",stem:"Which of the following BEST describes the relationship between an EMR and medical direction?",options:["EMRs operate independently and do not require medical oversight","Medical direction provides the legal authority and clinical oversight under which EMRs practice","Medical direction only applies during online communication with a physician","EMRs only need medical direction for ALS-level interventions"],correct:[1],explain:"Both online (direct) and offline (protocols, training) medical direction provide the legal framework and clinical oversight for EMR practice.",points:1},
  {section:"Communications & Documentation",type:"mc",stem:"When reporting to the receiving hospital by radio, which of the following components should be included FIRST?",options:["The patient's full name and address","Your unit identifier and estimated time of arrival","The patient's insurance information","A complete list of all medications the patient takes"],correct:[1],explain:"Radio reports to the receiving facility should begin with unit identification and ETA, followed by patient age/sex, chief complaint, vitals, treatment, and response.",points:1},
  {section:"Communications & Documentation",type:"mc",stem:"You make an error while writing a patient care report. The CORRECT way to handle this is to:",options:["Use correction fluid (white-out) to cover the error and write over it","Draw multiple lines through the error until it is unreadable","Draw a single line through the error, initial it, and write the correct information","Start a new report from the beginning"],correct:[2],explain:"A single line through the error — leaving it legible — followed by initials and the correct information preserves the document's legal integrity.",points:1},
  {section:"Anatomy, Physiology & Medical Terminology",type:"matching",stem:"Match each medical terminology prefix or suffix with its correct meaning.",pairs:[{term:"-emia",def:"Condition of the blood"},{term:"Brady-",def:"Slow"},{term:"Hyper-",def:"Above normal or excessive"},{term:"Tachy-",def:"Fast"},{term:"-itis",def:"Inflammation"}],points:1},
  {section:"Anatomy, Physiology & Medical Terminology",type:"mc",stem:"The mediastinum is BEST described as the:",options:["Space between the lungs containing the heart, great vessels, trachea, and esophagus","Cavity between the parietal and visceral pleura","Lower portion of the abdominal cavity","Space between the diaphragm and the pelvis"],correct:[0],explain:"The mediastinum is the central chest compartment bounded by the lungs laterally, the sternum anteriorly, and the spine posteriorly. It contains the heart, great vessels, trachea, esophagus, and thymus.",points:1},
  {section:"Anatomy, Physiology & Medical Terminology",type:"mc",stem:"Which organ is located in the RIGHT upper quadrant (RUQ) of the abdomen?",options:["Spleen","Liver","Sigmoid colon","Left kidney"],correct:[1],explain:"The liver is the primary organ in the RUQ, along with the gallbladder, portions of the colon, and the right kidney. The spleen is in the LUQ.",points:1},
  {section:"Anatomy, Physiology & Medical Terminology",type:"mc",stem:"A patient has a laceration on the medial aspect of the left forearm. This means the wound is on the:",options:["Outer surface toward the thumb side","Inner surface toward the little finger side","Posterior surface of the arm","Lateral surface near the elbow"],correct:[1],explain:"Medial means toward the midline of the body. On the forearm, medial is the inner surface — the side of the little finger (ulnar side).",points:1},
  {section:"Anatomy, Physiology & Medical Terminology",type:"best2",stem:"Which TWO body systems work TOGETHER most directly to regulate oxygen delivery to tissues?",options:["Integumentary system","Respiratory system","Musculoskeletal system","Cardiovascular system"],correct:[1,3],explain:"The respiratory system brings oxygen into the blood, and the cardiovascular system delivers oxygenated blood to the tissues. These two systems are the primary drivers of oxygen delivery.",points:1},
  {section:"Anatomy, Physiology & Medical Terminology",type:"matching",stem:"Match each body system with its PRIMARY function.",pairs:[{term:"Respiratory",def:"Gas exchange — delivers oxygen and removes CO2"},{term:"Nervous",def:"Controls and coordinates body functions via electrical signals"},{term:"Endocrine",def:"Regulates body functions through hormone secretion"},{term:"Lymphatic",def:"Returns excess fluid to circulation and supports immunity"},{term:"Integumentary",def:"Protects the body and regulates temperature"}],points:1},
  {section:"Lifting, Moving & Patient Positioning",type:"mc",stem:"You need to quickly move an unresponsive patient from a burning vehicle. The MOST appropriate technique is:",options:["Extremity lift","Long backboard carry","Emergency drag by the clothing or axillary drag","Stair chair carry"],correct:[2],explain:"Emergency drags are used when immediate danger requires moving a patient quickly without time for spinal precautions. The axillary drag or clothing drag keeps the spine as aligned as possible.",points:1},
  {section:"Lifting, Moving & Patient Positioning",type:"mc",stem:"Which of the following describes the CORRECT power grip technique?",options:["Palms facing downward with thumbs wrapped over the top","All fingers and the palm in contact with the object, thumbs up, with equal spacing","Two-fingered grip to avoid strain on the hands","Palms facing each other with fingers interlocked under the object"],correct:[1],explain:"The power grip uses all fingers and the palm in full contact with the stretcher bar. Palms face upward, thumbs point toward the direction of travel, and fingers are equally spaced.",points:1},
  {section:"Lifting, Moving & Patient Positioning",type:"mc",stem:"A patient with suspected spinal injury is found prone (face down). After applying spinal precautions, you should:",options:["Leave the patient prone and immobilize in that position for transport","Log roll the patient to a supine position using at least three rescuers maintaining in-line stabilization","Rapidly flip the patient supine using a scoop stretcher without additional personnel","Place the patient in the recovery position on their side"],correct:[1],explain:"Patients with suspected spinal injury found prone should be log-rolled to supine by at least 3 rescuers — one maintaining in-line cervical stabilization — before full spinal immobilization.",points:1},
  {section:"Lifting, Moving & Patient Positioning",type:"best2",stem:"Which TWO of the following are correct principles of safe patient lifting?",options:["Keep the patient as far from your body as possible for better control","Keep your back straight and lift with your legs","Position your feet shoulder-width apart before lifting","Twist your torso to change direction while holding the patient"],correct:[1,2],explain:"Safe lifting requires a straight back, leg-driven power, and a stable base of support. Twisting while loaded and reaching far from the body are leading causes of back injury.",points:1},
  {section:"Airway Management",type:"mc",stem:"You are ventilating an adult patient with a BVM when the chest is not rising. After repositioning the airway, the chest still does not rise. What is the NEXT step?",options:["Increase ventilation rate to 20 breaths per minute","Perform a visual check and attempt to remove any visible oral foreign body obstruction","Switch immediately to mouth-to-mask ventilation","Apply oxygen via non-rebreather mask and reassess"],correct:[1],explain:"If repositioning fails to produce chest rise, a foreign body airway obstruction should be suspected. Perform a visual check and, if an obstruction is visible, attempt to remove it.",points:1},

function shuffle(arr) { return [...arr].sort(() => Math.random()-0.5); }
function initShuffles() {

// ── SCORING ──────────────────────────────────────────
function scoreQuestion(q, ans) {
  if (ans === undefined || ans === null) return false;
  if (q.type === "mc")      return Array.isArray(ans) && ans[0] === q.correct[0];
  if (q.type === "best2")   return Array.isArray(ans) && ans.length===2 && ans.every(a=>q.correct.includes(a));
  if (q.type === "build") {
    const order = Array.isArray(ans) ? ans : [...Array(q.items.length).keys()];
    return order.length === q.order.length && order.every((v,j) => v === q.order[j]);
  }
  if (q.type === "matching") return Array.isArray(ans) && q.pairs.every((p,ti)=>ans[ti]===p.def);
  return false;
}
function calcScore() {
  let score=0, total=0;
  questions.forEach((q,i)=>{ total+=q.points; if(scoreQuestion(q,answers[i])) score+=q.points; });
  return {score,total};
}
 
// ── SAVE MATCHING ANS ────────────────────────────────
function saveMatchingAnswers(qIdx) {

}
function updateTimerUI() {
  const m = Math.floor(timeLeft/60), s = timeLeft%60;
  const str = `${m}:${String(s).padStart(2,"0")}`;
  const color = timeLeft<60?"#ef4444":timeLeft<180?"#b45309":"#22c55e";
  document.querySelectorAll(".timer-text").forEach(el=>{ el.textContent=str; el.style.color=color; });
  document.querySelectorAll(".timer-dot").forEach(el=>{ el.style.background=color; el.classList.toggle("pulse",timeLeft<60); });

}
 
// ── SUBMIT TO GOOGLE SHEETS ──────────────────────────
// Uses GET with ?payload= because Apps Script cross-origin POST is blocked
// by CORS preflight. GET requests follow the redirect and reach doGet().
async function submitToFirebase(subData) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 15000);
  try {
    const url = `https://firestore.googleapis.com/v1/projects/${FB_CONFIG.projectId}/databases/(default)/documents/examResults`;
    const answersStr = JSON.stringify(subData.answersData, (k,v) => v === undefined ? null : v);
    const body = {
      fields: {
        examLabel:  {stringValue: subData.examLabel},
        category:   {stringValue: EXAM_CATEGORY},
        name:       {stringValue: subData.name},
        score:      {integerValue: subData.score},
        total:      {integerValue: subData.total},
        pct:        {integerValue: subData.pct},
        timeUsed:   {integerValue: subData.timeUsed},
        submittedAt:{stringValue: subData.submittedAt},
        answersData:{stringValue: answersStr},
      }
    };
    const resp = await fetch(url + `?key=${FB_CONFIG.apiKey}`, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(body),
      signal: controller.signal,
    });
    clearTimeout(timeout);
    if (!resp.ok) { const errText = await resp.text(); throw new Error(errText); }
    return { success: true };
  } catch(e) {
    clearTimeout(timeout);
    console.error("Firebase submit error:", e);
    return { success: false, error: e.toString() };
  }
}
 
// ── FINISH EXAM ──────────────────────────────────────
async function finishExam() {
  clearInterval(timerInterval);
  const {score,total} = calcScore();
  const pct = Math.round((score/total)*100);
  const timeUsed = TOTAL_TIME - timeLeft;
  const questionResults = questions.map((q,i)=>scoreQuestion(q,answers[i]));
 
  const answersData = questions.map((q, i) => {
    const given = answers[i] !== undefined ? answers[i] : null;
    const correct = q.correct !== undefined ? q.correct
                  : q.order   !== undefined ? q.order
                  : q.pairs   !== undefined ? q.pairs.map(p => p.def)
                  : null;
    return { given, correct };
  });
  const subData = {
    examLabel: EXAM_LABEL,
    name: studentName,
    score, total, pct, timeUsed,
    answersData,
    submittedAt: new Date().toISOString(),
  };
 
  phase = "submitting";
  render();

  try {
    const result = await submitToFirebase(subData);
    window._submitResult = result;
  } catch(e) {
    console.error('finishExam error:', e);
    window._submitResult = { success: false, error: e.toString() };
  }
  phase = "results";
  window._examScore = {score,total,pct};
  window._questionResults = questionResults;
  render();
}

// ── EVENT BINDING ────────────────────────────────────
function attachEvents() {
  // INTRO
  const nameInput = document.getElementById("nameInput");
  const beginBtn  = document.getElementById("beginBtn");
  if (nameInput) {
    nameInput.value = studentName;
    nameInput.addEventListener("input", e=>{
      studentName = e.target.value.trim();
      nameInput.classList.toggle("has-value", !!studentName);
      beginBtn.disabled = !studentName;
      beginBtn.classList.toggle("active", !!studentName);
    });
    nameInput.addEventListener("keydown", e=>{ if(e.key==="Enter"&&studentName) beginExam(); });
  }
  if (beginBtn) {
    beginBtn.classList.toggle("active", !!studentName);
    beginBtn.addEventListener("click", ()=>{ if(studentName) beginExam(); });
  }
 
  // EXAM — MC / Best2
  document.querySelectorAll(".option-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const idx = parseInt(btn.dataset.idx);
      const q = questions[current];
      if (q.type==="mc") {
        answers[current] = [idx];
      } else {
        const prev = answers[current] || [];
        if (prev.includes(idx)) answers[current] = prev.filter(i=>i!==idx);
        else if (prev.length<2) answers[current] = [...prev,idx];
        else answers[current] = [prev[1],idx];
      }
      render();
    });
  });
 
  // ── MATCHING — touch/mouse drag ──────────────────────────────────────────
  let draggingEl = null;
  let dragGhost  = null;
  let dragOffX   = 0, dragOffY = 0;

  function createGhost(el) {
    const ghost = el.cloneNode(true);
    const rect  = el.getBoundingClientRect();
    ghost.style.cssText = `position:fixed;left:${rect.left}px;top:${rect.top}px;width:${rect.width}px;
      opacity:0.85;pointer-events:none;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,0.25);
      transform:scale(1.03);transition:none;margin:0;`;
    document.body.appendChild(ghost);
    return ghost;
  }

  function moveGhost(clientX, clientY) {
    if (!dragGhost) return;
    dragGhost.style.left = (clientX - dragOffX) + 'px';
    dragGhost.style.top  = (clientY - dragOffY) + 'px';
  }

  function getClientXY(e) {
    if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    if (e.changedTouches && e.changedTouches.length > 0) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
    return { x: e.clientX, y: e.clientY };
  }

  function elementFromPoint(x, y) {
    if (dragGhost) dragGhost.style.display = 'none';
    const el = document.elementFromPoint(x, y);
    if (dragGhost) dragGhost.style.display = '';
    return el;
  }

  function chipDragStart(e, chip) {
    e.preventDefault();
    draggingEl = chip;
    chip.classList.add('dragging');
    const def = decodeURIComponent(chip.dataset.def);
    const fromTerm = chip.dataset.fromTerm !== undefined ? parseInt(chip.dataset.fromTerm) : null;
    dragData = { def, fromTermIdx: fromTerm };
    const { x, y } = getClientXY(e);
    const rect = chip.getBoundingClientRect();
    dragOffX = x - rect.left;
    dragOffY = y - rect.top;
    dragGhost = createGhost(chip);
  }

  function chipDragMove(e) {
    if (!draggingEl) return;
    e.preventDefault();
    const { x, y } = getClientXY(e);
    moveGhost(x, y);
    // Highlight drop target
    document.querySelectorAll('.term-row,.def-bank').forEach(el => el.classList.remove('dragover'));
    const target = elementFromPoint(x, y);
    if (target) {
      const row = target.closest('.term-row');
      const bank = target.closest('.def-bank');
      if (row) row.classList.add('dragover');
      else if (bank) bank.classList.add('dragover');
    }
  }

  function chipDragEnd(e) {
    if (!draggingEl) return;
    const { x, y } = getClientXY(e);
    // Find drop target
    const target = elementFromPoint(x, y);
    document.querySelectorAll('.term-row,.def-bank').forEach(el => el.classList.remove('dragover'));
    if (dragGhost) { dragGhost.remove(); dragGhost = null; }
    draggingEl.classList.remove('dragging');
    draggingEl = null;
    if (!dragData) return;
    const { def, fromTermIdx } = dragData; dragData = null;
    if (target) {
      const row = target.closest('.term-row');
      const bank = target.closest('.def-bank');
      if (row) {
        const termIdx = parseInt(row.dataset.termIdx);
        if (fromTermIdx !== null && fromTermIdx !== undefined) delete matchSels[`${current}-${fromTermIdx}`];
        Object.keys(matchSels).forEach(k => { if (matchSels[k] === def) delete matchSels[k]; });
        matchSels[`${current}-${termIdx}`] = def;
        saveMatchingAnswers(current);
        render();
      } else if (bank) {
        if (fromTermIdx !== null && fromTermIdx !== undefined) {
          delete matchSels[`${current}-${fromTermIdx}`];
          saveMatchingAnswers(current);
          render();
        }
      }
    }
  }

  document.querySelectorAll('.def-chip').forEach(chip => {
    chip.addEventListener('mousedown',  e => chipDragStart(e, chip));
    chip.addEventListener('touchstart', e => chipDragStart(e, chip), { passive: false });
  });
  document.addEventListener('mousemove',  chipDragMove);
  document.addEventListener('touchmove',  chipDragMove, { passive: false });
  document.addEventListener('mouseup',    chipDragEnd);
  document.addEventListener('touchend',   chipDragEnd);

  // ── BUILD — touch/mouse drag to reorder ──────────────────────────────────
  const buildList = document.getElementById('buildList');
  if (buildList) {
    let buildDragSrcPos = null;
    let buildDraggingEl = null;
    let buildGhost      = null;
    let buildOffX = 0, buildOffY = 0;

    function buildDragStart(e, item) {
      e.preventDefault();
      buildDraggingEl = item;
      buildDragSrcPos = parseInt(item.dataset.pos);
      item.classList.add('dragging');
      const { x, y } = getClientXY(e);
      const rect = item.getBoundingClientRect();
      buildOffX = x - rect.left;
      buildOffY = y - rect.top;
      buildGhost = createGhost(item);
    }

    function buildDragMove(e) {
      if (!buildDraggingEl) return;
      e.preventDefault();
      const { x, y } = getClientXY(e);
      moveGhost2(x, y);
      buildList.querySelectorAll('.build-item').forEach(i => i.classList.remove('drag-over'));
      const target = elementFromPoint2(x, y);
      if (target) {
        const item = target.closest('.build-item');
        if (item && item !== buildDraggingEl) item.classList.add('drag-over');
      }
    }

    function moveGhost2(cx, cy) {
      if (!buildGhost) return;
      buildGhost.style.left = (cx - buildOffX) + 'px';
      buildGhost.style.top  = (cy - buildOffY) + 'px';
    }

    function elementFromPoint2(x, y) {
      if (buildGhost) buildGhost.style.display = 'none';
      const el = document.elementFromPoint(x, y);
      if (buildGhost) buildGhost.style.display = '';
      return el;
    }

    function buildDragEnd(e) {
      if (!buildDraggingEl) return;
      const { x, y } = getClientXY(e);
      const target = elementFromPoint2(x, y);
      buildList.querySelectorAll('.build-item').forEach(i => i.classList.remove('drag-over'));
      if (buildGhost) { buildGhost.remove(); buildGhost = null; }
      buildDraggingEl.classList.remove('dragging');
      const srcPos = buildDragSrcPos;
      buildDraggingEl = null;
      buildDragSrcPos = null;
      if (target) {
        const item = target.closest('.build-item');
        if (item) {
          const targetPos = parseInt(item.dataset.pos);
          if (srcPos !== null && srcPos !== targetPos) {
            const currentOrder = answers[current] || [...Array(questions[current].items.length).keys()];
            const newOrder = [...currentOrder];
            const [moved] = newOrder.splice(srcPos, 1);
            newOrder.splice(targetPos, 0, moved);
            answers[current] = newOrder;
            render();
          }
        }
      }
    }

    buildList.querySelectorAll('.build-item').forEach(item => {
      item.addEventListener('mousedown',  e => buildDragStart(e, item));
      item.addEventListener('touchstart', e => buildDragStart(e, item), { passive: false });
    });
    document.addEventListener('mousemove',  buildDragMove);
    document.addEventListener('touchmove',  buildDragMove, { passive: false });
    document.addEventListener('mouseup',    buildDragEnd);
    document.addEventListener('touchend',   buildDragEnd);
  }

  // NAV
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const submitExamBtn = document.getElementById("submitExamBtn");
  const submitTopBtn  = document.getElementById("submitTopBtn");
 
  if (prevBtn) prevBtn.addEventListener("click", ()=>{ if(current>0){ current--; render(); }});
  if (nextBtn) nextBtn.addEventListener("click", ()=>{ if(current<questions.length-1){ current++; render(); }});
  if (submitExamBtn) submitExamBtn.addEventListener("click", finishExam);
  if (submitTopBtn)  submitTopBtn.addEventListener("click",  finishExam);
 
  // Dot nav
  document.querySelectorAll(".dot").forEach(dot=>{
    dot.addEventListener("click", ()=>{ current=parseInt(dot.dataset.dot); render(); });
  });
 
  // Update timer display immediately
  updateTimerUI();
}
 
function beginExam() {
  initShuffles();
  phase = "exam";
  render();
  startTimer();
}
 
// ── BOOT ─────────────────────────────────────────────
document.addEventListener("DOMContentLoaded", ()=>{
  document.getElementById("root").innerHTML = "";
  render();
});

// ── REVIEW MODE ──────────────────────────────────────
async function startReviewMode(studentName) {
  try {
    const url = `https://firestore.googleapis.com/v1/projects/${FB_CONFIG.projectId}/databases/(default)/documents:runQuery?key=${FB_CONFIG.apiKey}`;
    const body = { structuredQuery: {
      from: [{ collectionId: 'examResults' }],
      where: { fieldFilter: { field: { fieldPath: 'name' }, op: 'EQUAL', value: { stringValue: studentName } } }
    }};
    const resp = await fetch(url, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const rows = await resp.json();

    let match = null;
    for (const row of rows) {
      if (!row.document) continue;
      const f = row.document.fields || {};
      if (f.examLabel?.stringValue === EXAM_LABEL) { match = f; break; }
    }
    if (!match) {
      alert('No submission found for ' + studentName + ' on ' + EXAM_LABEL + '. Have them submit the exam first.');
      return;
    }

    const saved = JSON.parse(match.answersData?.stringValue || '[]');
    // Restore answers array — main exams store positional [{given, correct}, ...]
    saved.forEach((a, i) => {
      if (a && a.given !== undefined && a.given !== null) {
        answers[i] = a.given;
      }
    });

    // Restore matching answers
    questions.forEach((q, qi) => {
      if (q.type === 'matching' && saved[qi] && saved[qi].given) {
        const givenPairs = saved[qi].given;
        if (Array.isArray(givenPairs)) {
          givenPairs.forEach((def, ti) => {
            if (def) matchSels[qi + '-' + ti] = def;
          });
        }
      }
    });

    studentName = studentName;
    const timeUsed = parseInt(match.timeUsed?.integerValue || 0);
    timeLeft = Math.max(0, TOTAL_TIME - timeUsed);

    // Score and show results
    const qr = questions.map((q, i) => scoreQuestion(q, answers[i]));
    const {score, total} = calcScore();
    const pct = Math.round((score / total) * 100);
    window._examScore = {score, total, pct};
    window._questionResults = qr;
    window._submitResult = { success: true, noUrl: true };

    phase = 'results';
    render();

    // Banner
    const banner = document.createElement('div');
    banner.style.cssText = 'background:#1a2744;color:#fcd34d;border-bottom:3px solid #b45309;text-align:center;padding:10px;font-size:14px;font-weight:bold;position:sticky;top:0;z-index:999;';
    banner.textContent = '📋 Review Mode — ' + studentName + ' — ' + EXAM_LABEL;
    document.body.insertBefore(banner, document.body.firstChild);
  } catch(e) {
    console.error('Review mode error:', e);
    alert('Could not load review. Check console for details.');
  }
}

// Trigger review mode from URL params
(function() {
  const params = new URLSearchParams(window.location.search);
  const isReview = params.get('review') === '1';
  const reviewName = decodeURIComponent(params.get('name') || '').trim();
  if (isReview && reviewName) {
    window.addEventListener('DOMContentLoaded', () => { startReviewMode(reviewName); });
  }
})();

</script>
