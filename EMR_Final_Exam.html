  }
  .btn-begin.active {

    cursor: pointer; box-shadow: 0 8px 32px rgba(21,101,192,0.5);
  }
  .btn-begin.active:hover { transform: translateY(-2px); }
 
  /* ── TOP BAR ── */
  .topbar {
    position: sticky; top: 0; z-index: 100;
    background: #1a2744; border-bottom: 3px solid #b45309; padding: 0 24px;
  }
  .topbar-inner {
    max-width: 860px; margin: 0 auto; display: flex;
    align-items: center; gap: 16px; height: 60px;
  }
  .progress-wrap { flex: 1; display: flex; align-items: center; gap: 10px; }
  .progress-bar { flex: 1; height: 6px; background: #ead9b8; border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; border-radius: 3px; transition: width 0.3s; }
  .progress-text { color: #44403c; font-size: 13px; white-space: nowrap; }
  .timer-box {

  .btn-submit-top {
    background: #b91c1c; color: #fff; border: none; border-radius: 8px;
    padding: 8px 18px; font-size: 13px; font-weight: 700; cursor: pointer;

  /* ── EXAM BODY ── */

    display: inline-flex; align-items: center; gap: 8px;

    border-radius: 6px; padding: 3px 10px; font-size: 12px;

  .q-stem { font-size: 19px; color: #ffffff; line-height: 1.7; margin-bottom: 32px; padding-bottom: 24px; border-bottom: 1px solid #1e2a3a; }
  .options-list { display: flex; flex-direction: column; gap: 10px; }
  .best2-hint { color: #fcd34d; font-size: 13px; margin-bottom: 8px; }
  .option-btn {
    display: flex; align-items: flex-start; gap: 14px; padding: 16px 20px;
    background: #ffffff; border: 2px solid #1e2a3a; border-radius: 10px;

    color: #1e3a5f; font-family: Georgia, serif; font-size: 16px; width: 100%;

  .option-btn:hover { border-color: #1a2744; }
  .option-btn.selected { background: #fef3c7; border-color: #b91c1c; color: #1e3a5f; }
  .option-indicator {
    width: 28px; height: 28px; border-radius: 50%; border: 2px solid #1a2744;
    background: transparent; display: flex; align-items: center; justify-content: center;

  .option-btn.selected .option-indicator {

  .match-instructions { color: #e2e8f0; font-size: 13px; margin-bottom: 20px; line-height: 1.6; }

    padding: 10px 14px; background: #ffffff; border: 1px solid #d6c9a8;
    border-radius: 8px; cursor: grab; color: #1e3a5f; font-size: 14px;

  .term-placeholder.active { color: #b45309; }
 
  /* ── NAV ── */
  .nav-bar { display: flex; justify-content: space-between; align-items: center; margin-top: 40px; padding-top: 24px; border-top: 1px solid #1e2a3a; }

  .btn-prev { background: transparent; color: #e2e8f0; border: 1px solid #1a2744; }
  .btn-prev:disabled { color: #e2e8f0; border-color: #e2e8f0; cursor: default; }
  .btn-next { background: #b91c1c; color: #fff; border: none; font-weight: 700; }
  .btn-submit-exam { background: #22c55e; color: #fff; border: none; font-weight: 700; }
  .dots { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; max-width: 400px; }
  .dot { height: 10px; border-radius: 5px; cursor: pointer; transition: all 0.2s; background: #ead9b8; }
  .dot.answered { background: #ead9b8; }
  .dot.current { background: #b91c1c; }
 
  /* ── RESULTS ── */
  .results-wrap { min-height: 100vh; padding: 40px 20px; font-family: Georgia, serif; }
  .results-inner { max-width: 780px; margin: 0 auto; }
  .results-hero { text-align: center; margin-bottom: 40px; }
  .results-icon { font-size: 80px; margin-bottom: 8px; }
  .results-name { font-size: 22px; color: #44403c; margin-bottom: 4px; }
  .results-pct { font-size: 48px; font-weight: 700; color: #fff; margin-bottom: 4px; }
  .results-verdict { font-size: 22px; margin-bottom: 4px; }
  .results-detail { color: #78716c; font-size: 15px; }
  .results-card { background: #ffffff; border-radius: 16px; padding: 24px; margin-bottom: 24px; }
  .results-card-title { color: #fca5a5; font-size: 13px; letter-spacing: 4px; text-transform: uppercase; margin-bottom: 16px; }
  .result-row { display: flex; align-items: flex-start; gap: 12px; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .result-row:last-child { border-bottom: none; }
  .result-badge { width: 28px; height: 28px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 13px; font-weight: 700; flex-shrink: 0; margin-top: 2px; }
  .result-badge.correct { background: #2e7d32; }
  .result-badge.wrong { background: #c62828; }
  .result-stem { color: #e7d5b3; font-size: 14px; margin-bottom: 4px; }
  .result-correct-ans { font-size: 13px; color: #81c784; }
  .result-pts { font-weight: 700; font-size: 14px; flex-shrink: 0; }
  .submitting-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); display: flex; align-items: center; justify-content: center; z-index: 200; flex-direction: column; gap: 16px; }
  .submitting-spinner { width: 48px; height: 48px; border: 4px solid #1e2a3a; border-top-color: #b91c1c; border-radius: 50%; animation: spin 0.8s linear infinite; }
  .submitting-text { color: #e2e8f0; font-size: 16px; }
  .submit-status { text-align: center; padding: 16px; border-radius: 12px; margin-bottom: 24px; font-size: 14px; }
  .submit-status.success { background: #dcfce7; border: 1px solid #16a34a; color: #15803d; }
  .submit-status.error { background: #2d0a0a; border: 1px solid #7f1d1d; color: #fca5a5; }
 
  /* ── ORDER / SEQUENCING ── */
  .order-instructions { color: #e2e8f0; font-size: 13px; margin-bottom: 16px; line-height: 1.6; }
  .order-instructions strong { color: #b45309; }
  .build-list { display: flex; flex-direction: column; gap: 8px; }
  .build-item {
    display: flex; align-items: center; gap: 14px; padding: 14px 16px;
    background: #ffffff; border: 2px solid #1e2a3a; border-radius: 10px;
    cursor: grab; user-select: none; font-family: Georgia, serif;
    font-size: 15px; color: #1e3a5f; transition: all 0.15s;
  }
  .build-item:hover { border-color: #b45309; }
  .build-item.dragging { opacity: 0.4; }
  .build-item.drag-over { border-color: #b91c1c; background: #fef3c7; }
  .build-pos {
    width: 28px; height: 28px; border-radius: 50%; background: #1a2744;
    color: #fcd34d; display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 13px; flex-shrink: 0;
  }
  .build-handle { color: #94a3b8; font-size: 18px; flex-shrink: 0; }

  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>

<script>
// ══════════════════════════════════════════════════════

const FB_CONFIG = {
  apiKey:"AIzaSyBQGGn1JcsyVRuIovHhIMEm0q4kP48OjMw",
  authDomain:"class-attendance-72cd9.firebaseapp.com",
  projectId:"class-attendance-72cd9",
};
const EXAM_LABEL      = "Final Exam";
const EXAM_CATEGORY   = "final";
const TOTAL_TIME      = 120 * 60; // 120 minutes
const LETTERS         = ["A","B","C","D","E"];
 
// ── QUESTION DATA ────────────────────────────────────
const questions = [
  // ── SCENE SIZE-UP & SAFETY (6 questions) ──────────────────────────────────
  {section:"Scene Size-up & Safety",type:"mc",stem:"You are dispatched to a 'man down' at a local bar at 0200. Dispatch reports the caller hung up. As you approach, you see two groups of bystanders arguing loudly and bottles on the ground. Your MOST appropriate first action is:",options:["Enter immediately — your patient needs help","Stage at a safe distance and request law enforcement before approaching","Don gloves and approach from a different angle","Ask a bystander to confirm the scene is safe before you enter"],correct:[1],points:1},
  {section:"Scene Size-up & Safety",type:"mc",stem:"You arrive at a single-vehicle crash. The car has significant front-end damage, the airbags deployed, and the windshield is starred. The driver is still inside. Which finding from scene size-up MOST increases your index of suspicion for serious injury?",options:["The airbag deployed, which typically prevents injury","Starring of the windshield suggests unrestrained head impact against the glass","The front-end damage indicates only bumper injury","The patient is conscious and speaking, ruling out significant head trauma"],correct:[1],points:1},
  {section:"Scene Size-up & Safety",type:"mc",stem:"Dispatch advises you are responding to a reported 'difficulty breathing' at a residence known for prior drug activity. On arrival the door is ajar and you can smell an unusual chemical odor. Which action is MOST appropriate?",options:["Enter with gloves and a surgical mask — you are already equipped","Back away, do not enter, request hazmat and law enforcement, and establish a safe perimeter","Enter quickly, grab the patient, and exit before exposure becomes significant","Open windows to ventilate the scene, then enter to assess"],correct:[1],points:1},
  {section:"Scene Size-up & Safety",type:"best2",stem:"You arrive at a two-vehicle collision with apparent significant damage. Which TWO pieces of scene size-up information should MOST influence your decision to request additional resources?",options:["The number of patients visible and the severity of the mechanism","The color of the vehicles involved","Evidence of fuel leaking and fire risk at the scene","The time of day the collision occurred","Whether bystanders are already providing care"],correct:[0,2],points:1},
  {section:"Scene Size-up & Safety",type:"mc",stem:"At a residential structure fire response, you and your partner are assigned to medical standby. Firefighters bring out a patient who is unresponsive. Before beginning patient assessment, your FIRST priority is:",options:["Begin primary assessment immediately — time is critical","Confirm with the incident commander that the patient has been removed to the cold zone and the scene is safe for you to work","Ask bystanders what happened while your partner begins CPR","Don an SCBA before touching the patient"],correct:[1],points:1},
  {section:"Scene Size-up & Safety",type:"mc",stem:"You are dispatched to a reported 'man with a gun' who has been shot. Law enforcement advises the scene is not yet cleared. Your MOST appropriate action is:",options:["Respond to the scene and stage at a distance until law enforcement secures it","Proceed directly to the patient — every second counts in a gunshot wound","Enter only if the patient is visibly bleeding and requesting help","Refuse the call entirely and return to quarters"],correct:[0],points:1},
  {section:"Scene Size-up & Safety",type:"order",stem:"You arrive at a reported motor vehicle collision. Place the following scene size-up actions in the correct priority order:",items:["Determine the number of patients and call for additional resources if needed","Ensure BSI — don appropriate PPE before exiting the unit","Scan for hazards: traffic, fuel leaks, downed power lines, fire","Identify the mechanism of injury from scene observation","Request ALS if severity warrants based on MOI and patient count"],order:[1,2,0,3,4],points:1},

  // ── EMS SYSTEMS, ROLE & MEDICAL/LEGAL (6 questions) ───────────────────────
  {section:"EMS Systems, EMR Role & Medical/Legal",type:"mc",stem:"An EMR is treating a patient when a paramedic unit arrives on scene. The EMR's responsibility at this point is to:",options:["Immediately stop all interventions and step back","Give a concise patient handoff report and transfer care only when the paramedic assumes responsibility","Leave the scene once the paramedic makes eye contact","Continue treating independently and let the paramedic assess separately"],correct:[1],points:1},
  {section:"EMS Systems, EMR Role & Medical/Legal",type:"mc",stem:"A patient with an altered mental status caused by alcohol intoxication is refusing care. Which principle BEST justifies treating this patient?",options:["Expressed consent — the patient verbally agreed by not physically resisting","Implied consent — the patient lacks decision-making capacity and would likely consent if competent","The EMR's duty to act supersedes patient rights in all circumstances","Good Samaritan laws protect the EMR regardless of patient consent"],correct:[1],points:1},
  {section:"EMS Systems, EMR Role & Medical/Legal",type:"mc",stem:"To prove negligence against an EMR, which of the following four elements must ALL be established?",options:["Duty, intent, harm, documentation","Duty to act, breach of that duty, causation, and damages","Licensure, certification, documentation, and harm","Scope of practice violation, intent, breach, and apology"],correct:[1],points:1},
  {section:"EMS Systems, EMR Role & Medical/Legal",type:"mc",stem:"An EMR responds off-duty to a car accident and provides care. Which statement BEST applies?",options:["The EMR is required to respond and is covered by their agency's liability insurance","Good Samaritan laws may offer protection if the EMR acts in good faith within their training","The EMR has no legal protection outside their jurisdiction","The EMR must contact medical direction before providing any care"],correct:[1],points:1},
  {section:"EMS Systems, EMR Role & Medical/Legal",type:"mc",stem:"You are called to a residence for an unresponsive 81-year-old male. Before you begin resuscitation, his wife presents a DNR order signed by the patient and his physician. The document appears valid. You should:",options:["Disregard it and begin resuscitation — DNR orders are only valid inside a hospital","Honor the order; withhold resuscitation and provide comfort-focused care while documenting the DNR","Begin CPR anyway — once on scene, EMRs are legally required to attempt resuscitation regardless of advance directives","Request the original physician confirm the order by phone before honoring it"],correct:[1],explain:"A valid out-of-hospital DNR signed by the patient and physician must be honored by EMS providers. Comfort measures and supportive care are still appropriate. Beginning resuscitation against a valid DNR exposes the provider to liability and violates the patient's legal right to refuse treatment.",points:1},
  {section:"EMS Systems, EMR Role & Medical/Legal",type:"best2",stem:"Which TWO of the following are components that must be present for a patient's refusal of care to be legally valid?",options:["The patient demonstrates decision-making capacity","The patient must be over 21 years of age","The patient has been informed of the risks of refusal","A family member must co-sign the refusal form","The EMR must agree with the patient's decision"],correct:[0,2],points:1},

  // ── COMMUNICATIONS & DOCUMENTATION (4 questions) ──────────────────────────
  {section:"Communications & Documentation",type:"mc",stem:"An EMR is completing a patient care report after a patient refused transport. Which of the following BEST describes the documentation responsibility?",options:["No documentation is required since the patient refused care","Document only that the patient refused — no further detail needed","Document the patient's condition, risks of refusal explained, that the patient demonstrated capacity, that refusal was signed and witnessed, and instructions given","Document the refusal only if the patient appeared intoxicated or altered"],correct:[2],points:1},
  {section:"Communications & Documentation",type:"mc",stem:"You are transferring care of a 58-year-old male with chest pain to an arriving ALS crew. Which verbal report format is MOST appropriate?",options:["Tell the paramedic everything you observed in the order it happened, starting with your arrival","Give a structured report: patient age and chief complaint, history and pertinent findings, interventions performed and response, current status and trending vital signs","Ask the paramedic what information they need and answer their questions only","Report only the chief complaint and vital signs to save time"],correct:[1],points:1},
  {section:"Communications & Documentation",type:"mc",stem:"An EMR radios the receiving hospital with a patient report. Which of the following is the MOST important piece of information to communicate first?",options:["Your unit designation and the hospital's name","Your estimated time of arrival only","Your unit, your level of care, patient age and sex, chief complaint, and estimated time of arrival","A complete list of all medications the patient takes"],correct:[2],points:1},
  {section:"Communications & Documentation",type:"mc",stem:"After delivering a patient to the emergency department, the EMR realizes they forgot to document the patient's initial blood pressure on the PCR. The MOST appropriate action is:",options:["Leave it blank — undocumented vitals are better than incorrect ones","Add the blood pressure to the report with a note that it was omitted and the time it was recorded, using a late entry addendum","Rewrite the entire report from scratch","Ask a coworker to fill in an estimated blood pressure"],correct:[1],points:1},

  // ── PRIMARY ASSESSMENT (18 questions) ─────────────────────────────────────
  // Airway (7)
  {section:"Primary Assessment — Airway",type:"mc",stem:"An adult patient is unresponsive with no gag reflex. The EMR has successfully inserted an OPA. What is the NEXT appropriate airway intervention?",options:["Reassess and monitor — the OPA alone is sufficient","Begin BVM ventilations if breathing is absent or inadequate","Insert an NPA in addition to the OPA for redundancy","Position the patient prone to maintain the airway passively"],correct:[1],points:1},
  {section:"Primary Assessment — Airway",type:"mc",stem:"An adult patient is unresponsive and apneic following a suspected opioid overdose. You have opened the airway and are preparing to ventilate with a BVM. The correct ventilation rate is:",options:["6 to 8 breaths per minute","10 to 12 breaths per minute","16 to 20 breaths per minute","20 to 24 breaths per minute"],correct:[1],explain:"For an apneic adult without an advanced airway, the target rate is 1 breath every 5–6 seconds (10–12 per minute). Rates above 12 risk gastric distention and decreased venous return.",points:1},
  {section:"Primary Assessment — Airway",type:"mc",stem:"You are suctioning the oropharynx of an unresponsive adult patient with gurgling secretions. To minimize the risk of hypoxia during the procedure, each suction pass should not exceed:",options:["5 seconds","10 to 15 seconds","30 seconds","60 seconds"],correct:[1],explain:"Suctioning removes oxygen along with secretions. Limiting each pass to 10–15 seconds in adults prevents dangerous desaturation. Hyperoxygenate before and after each pass when possible.",points:1},
  {section:"Primary Assessment — Airway",type:"mc",stem:"Which of the following is the MOST reliable indicator that BVM ventilations are effective?",options:["Improvement in skin color alone","Audible breath sounds without chest rise","Visible bilateral chest rise with each ventilation","An oxygen saturation above 90%"],correct:[2],points:1},
  {section:"Primary Assessment — Airway",type:"mc",stem:"A patient is found with gurgling respirations. The FIRST intervention should be:",options:["Insert an OPA immediately","Suction the airway to clear secretions","Administer high-flow oxygen via NRB","Begin BVM ventilations with an oral airway in place"],correct:[1],points:1},
  {section:"Primary Assessment — Airway",type:"mc",stem:"You are managing the airway of a deeply unconscious patient. The patient has dentures that are firmly seated and an intact gag reflex. Which airway adjunct is MOST appropriate?",options:["OPA — the gag reflex is not a contraindication if dentures are present","NPA — preferred because of the intact gag reflex","Remove the dentures and insert an OPA","No adjunct — manage with positioning only"],correct:[1],explain:"An NPA is the preferred adjunct when a gag reflex is present. Dentures that are firmly seated can actually improve mask seal and do not require removal. An OPA is contraindicated with an intact gag reflex.",points:1},
  {section:"Primary Assessment — Airway",type:"matching",stem:"Match each oxygen delivery device with the approximate FiO2 it delivers.",pairs:[{term:"Nasal cannula at 4 LPM",def:"Approximately 36% oxygen; used for mild hypoxia in patients breathing adequately"},{term:"Simple face mask",def:"Approximately 40 to 60% oxygen; requires minimum 6 LPM to prevent CO2 rebreathing"},{term:"Non-rebreather mask at 15 LPM",def:"Approximately 60 to 100% oxygen; used for severe hypoxia in spontaneously breathing patients"},{term:"BVM with supplemental oxygen",def:"Approximately 90 to 100% oxygen; used for patients requiring assisted or controlled ventilation"},{term:"Blow-by oxygen",def:"Variable low concentration; used for infants and young children who will not tolerate a mask"}],points:1},
  // Breathing/Circulation (11)
  {section:"Primary Assessment — Breathing & Circulation",type:"mc",stem:"A patient with a history of COPD presents with pursed-lip breathing, barrel chest, and an SpO2 of 82%. The MOST appropriate oxygen therapy is:",options:["Withhold oxygen entirely to preserve hypoxic drive","Administer low-flow oxygen via nasal cannula at 1 to 2 LPM only","Administer high-flow oxygen via NRB mask targeting SpO2 of 94 to 98% and monitor respiratory rate closely","Apply a BVM immediately without attempting supplemental oxygen first"],correct:[2],points:1},
  {section:"Primary Assessment — Breathing & Circulation",type:"mc",stem:"Which of the following findings would prompt an EMR to begin positive pressure ventilation in a breathing patient?",options:["Respiratory rate of 18 with clear lung sounds","SpO2 of 94% on room air with normal respiratory effort","Respiratory rate of 6 with shallow, inadequate tidal volume despite oxygen therapy","Mild accessory muscle use with SpO2 of 92%"],correct:[2],points:1},
  {section:"Primary Assessment — Breathing & Circulation",type:"mc",stem:"You are ventilating an unresponsive adult with a BVM. Your partner reports that the chest is not rising with each breath and resistance has increased. The MOST likely cause and correct action is:",options:["The BVM reservoir is depleted; replace the oxygen source","The airway is obstructed or the mask seal is inadequate; reposition the airway, ensure a tight mask seal, and reassess","The patient is breathing spontaneously and resisting ventilation; reduce your rate","Gastric distention is causing diaphragm elevation; place the patient prone"],correct:[1],explain:"Absent chest rise with increased resistance during BVM ventilation most commonly indicates airway obstruction or mask seal failure. Reposition using head-tilt chin-lift or jaw thrust, reseat the mask, and reassess before assuming another cause.",points:1},
  {section:"Primary Assessment — Breathing & Circulation",type:"best2",stem:"Which TWO of the following findings indicate a pediatric patient requires immediate ventilatory assistance?",options:["Respiratory rate of 40 with nasal flaring and severe retractions","Respiratory rate of 26 with clear lung sounds and normal skin color","Cyanosis of the lips and fingertips despite supplemental oxygen","SpO2 of 95% on room air with unlabored breathing","Mild grunting on exhalation with normal SpO2 and good color"],correct:[0,2],points:1},
  {section:"Primary Assessment — Breathing & Circulation",type:"mc",stem:"Which of the following patient presentations is MOST consistent with tension pneumothorax?",options:["Bilateral wheezing, productive cough, low-grade fever","Absent breath sounds on one side, tracheal deviation away from the affected side, hypotension, and distended neck veins","Bilateral crackles, pink frothy sputum, and severe hypertension","Sudden sharp inspiratory chest pain with normal breath sounds bilaterally"],correct:[1],points:1},
  {section:"Primary Assessment — Breathing & Circulation",type:"mc",stem:"A patient has a large laceration to the femoral area with bright red blood that spurts with each heartbeat. After applying firm direct pressure for 3 minutes, bleeding continues. The MOST appropriate next step is:",options:["Remove the dressing, pack the wound, and apply a pressure bandage","Apply a tourniquet high and tight on the proximal thigh","Elevate the extremity above the heart and apply ice","Call for ALS and withhold further treatment until they arrive"],correct:[1],points:1},
  {section:"Primary Assessment — Breathing & Circulation",type:"mc",stem:"Which correctly describes the progression from compensated to decompensated hemorrhagic shock?",options:["Blood pressure remains stable throughout both phases","In compensated shock the body maintains BP through vasoconstriction; decompensated shock occurs when these mechanisms fail and BP drops","In decompensated shock the patient is always conscious and able to speak","Compensated shock always requires IV fluid resuscitation before decompensation can be prevented"],correct:[1],points:1},
  {section:"Primary Assessment — Breathing & Circulation",type:"mc",stem:"Which type of shock is characterized by warm, flushed skin below the level of injury combined with bradycardia after spinal cord trauma?",options:["Hypovolemic shock","Cardiogenic shock","Neurogenic shock","Anaphylactic shock"],correct:[2],points:1},
  {section:"Primary Assessment — Breathing & Circulation",type:"mc",stem:"Which of the following is the MOST important prehospital treatment priority for a patient in severe hemorrhagic shock?",options:["Establish IV access for fluid resuscitation before transport","Control all external bleeding and minimize scene time to enable rapid transport to definitive care","Administer high-flow oxygen via NRB and reassess every 5 minutes on scene","Perform a detailed secondary assessment before moving the patient"],correct:[1],points:1},
  {section:"Primary Assessment — Breathing & Circulation",type:"matching",stem:"Match each type of shock with its primary mechanism and key clinical feature.",pairs:[{term:"Hypovolemic shock",def:"Blood or fluid loss; tachycardia, hypotension, pale cool diaphoretic skin"},{term:"Cardiogenic shock",def:"Pump failure; hypotension despite adequate volume, pulmonary edema, weak pulse"},{term:"Distributive shock",def:"Massive vasodilation; warm or flushed skin, hypotension, variable heart rate"},{term:"Obstructive shock",def:"Mechanical blockage of cardiac output; e.g. tension pneumothorax or tamponade"},{term:"Anaphylactic shock",def:"Severe allergen response; urticaria, angioedema, bronchospasm, hypotension"}],points:1},
  {section:"Primary Assessment — Breathing & Circulation",type:"best2",stem:"Which TWO interventions are appropriate for a patient in anaphylactic shock with a known allergy who carries an epinephrine auto-injector?",options:["Assist the patient in using their epinephrine auto-injector","Administer oral diphenhydramine as the first-line treatment","Apply high-flow oxygen and prepare for airway deterioration","Position the patient prone to improve venous return","Withhold epinephrine until an ALS provider arrives"],correct:[0,2],points:1},
  {section:"Primary Assessment — Breathing & Circulation",type:"order",stem:"You arrive to find an adult patient who is conscious but in severe respiratory distress with an SpO2 of 82%. Place the following assessment and treatment actions in the correct priority order:",items:["Apply high-flow oxygen via non-rebreather mask","Form a general impression and note the patient's level of consciousness","Assess the airway — look, listen, and feel for air movement","Obtain a full set of baseline vital signs including respiratory rate and SpO2","Position the patient upright in a position of comfort to maximize respiratory effort"],order:[1,2,0,4,3],explain:"Primary assessment flows: general impression → airway → breathing (oxygen) → position of comfort → then baseline vitals. Oxygenation is addressed before a full vital signs set in a distressed patient.",points:1},

  // ── SECONDARY ASSESSMENT (14 questions) ───────────────────────────────────
  {section:"Secondary Assessment",type:"mc",stem:"During your assessment you identify a deep laceration with pulsatile bright red bleeding on the medial aspect of the proximal left thigh. Which intervention is MOST immediately indicated?",options:["Apply a pressure dressing and elevate the leg above the heart","Apply a tourniquet high and tight on the proximal thigh — this location and bleeding pattern suggest femoral artery involvement","Pack the wound with gauze and apply a pressure bandage only","Irrigate the wound, apply a sterile dressing, and transport"],correct:[1],explain:"Pulsatile bright red bleeding from the medial proximal thigh suggests femoral artery involvement. Direct pressure alone is unlikely to control arterial hemorrhage at this location. A tourniquet applied high and tight is the priority intervention.",points:1},
  {section:"Secondary Assessment",type:"mc",stem:"The coronary arteries receive blood flow PRIMARILY during which phase of the cardiac cycle?",options:["Systole — when ventricular pressure is highest","Diastole — when the myocardium is relaxed and ventricular pressure is low","Both systole and diastole equally","Only during tachycardia when cardiac output is increased"],correct:[1],explain:"The coronary arteries fill predominantly during diastole. During systole, high intramyocardial pressure compresses the coronary vessels. This is why tachycardia reduces coronary perfusion time.",points:1},
  {section:"Secondary Assessment",type:"mc",stem:"Tidal volume is BEST defined as:",options:["The maximum amount of air the lungs can hold","The amount of air moved in or out of the lungs with each normal breath","The air that remains in the lungs after maximum exhalation","The difference between maximum inhalation and maximum exhalation capacity"],correct:[1],points:1},
  {section:"Secondary Assessment",type:"mc",stem:"A patient is described as 'diaphoretic.' This means the patient is:",options:["Cyanotic","Pale and mottled","Sweating profusely","Experiencing muscle tremors"],correct:[2],points:1},
  {section:"Secondary Assessment",type:"matching",stem:"Match each cardiac structure with its correct function.",pairs:[{term:"SA node",def:"Primary pacemaker — initiates each electrical impulse at 60-100 bpm"},{term:"AV node",def:"Delays the impulse between atria and ventricles to allow ventricular filling"},{term:"Bundle of His",def:"Conducts the impulse from the AV node to the bundle branches"},{term:"Purkinje fibers",def:"Distributes the impulse throughout the ventricular myocardium causing contraction"},{term:"Chordae tendineae",def:"Fibrous cords anchoring the mitral and tricuspid valve leaflets to prevent inversion"}],points:1},
  {section:"Secondary Assessment",type:"mc",stem:"Crackles (rales) heard on lung auscultation are MOST consistent with:",options:["Bronchospasm from asthma","Fluid in the alveoli from pulmonary edema or pneumonia","Upper airway obstruction","Pleural friction from inflammation"],correct:[1],points:1},
  {section:"Secondary Assessment",type:"mc",stem:"You respond to a 54-year-old male found confused and agitated by his wife. He is diaphoretic, pale, and wearing a medic alert bracelet that reads 'Type 1 Diabetic.' His wife says he took his insulin an hour ago but did not eat. Which condition is MOST likely and what is your first treatment priority?",options:["Hypertensive emergency — assess blood pressure and prepare for rapid transport","Hypoglycemia — administer oral glucose immediately if he can swallow and protect his airway","Stroke — perform the Cincinnati Stroke Scale and note time of onset","Alcohol intoxication — supportive care and transport for evaluation"],correct:[1],explain:"Diaphoresis, pallor, agitation, and confirmed insulin use without eating in a type 1 diabetic strongly suggests hypoglycemia. Oral glucose is the priority intervention in a conscious patient who can swallow. Blood glucose confirmation supports the diagnosis.",points:1},
  {section:"Secondary Assessment",type:"mc",stem:"The Cincinnati Stroke Scale assesses which THREE findings?",options:["Blood pressure, pulse, and temperature","Facial droop, arm drift, and speech abnormality","Pupil response, grip strength, and gait","Level of consciousness, vision, and coordination"],correct:[1],points:1},
  {section:"Secondary Assessment",type:"mc",stem:"Cushing's triad, which indicates rising intracranial pressure, consists of:",options:["Tachycardia, hypotension, and tachypnea","Hypertension with widening pulse pressure, bradycardia, and irregular respirations","Hypotension, bradycardia, and dilated pupils","Fever, seizures, and nuchal rigidity"],correct:[1],points:1},
  {section:"Secondary Assessment",type:"mc",stem:"A patient presents with sudden onset of a severe 'thunderclap' headache described as the worst of their life, along with neck stiffness and photophobia. Which condition should the EMR MOST suspect?",options:["Tension headache","Migraine with aura","Subarachnoid hemorrhage","Hypertensive urgency"],correct:[2],points:1},
  {section:"Secondary Assessment",type:"mc",stem:"When assessing CSM (circulation, sensation, movement) after splinting a fracture, which finding indicates a vascular emergency?",options:["Capillary refill of 2 seconds","Mild pain at the fracture site with palpation","Absent distal pulse with numbness and inability to move fingers or toes","Moderate swelling at the fracture site"],correct:[2],points:1},
  {section:"Secondary Assessment",type:"mc",stem:"Which of the following pediatric anatomical differences MOST increases the risk of airway obstruction compared to adults?",options:["Smaller lung capacity requiring slower ventilation rates","The proportionally larger head causing neck flexion when supine, along with a higher, more anterior larynx","Lower respiratory drive requiring supplemental oxygen at lower flow rates","Greater chest wall compliance making compressions easier but ventilations harder"],correct:[1],points:1},
  {section:"Secondary Assessment",type:"mc",stem:"A patient fell from a 20-foot ladder and struck the ground feet-first. Based on kinematics, which injury pattern should the EMR be MOST prepared to find?",options:["Isolated bilateral ankle fractures","Bilateral calcaneus fractures, lumbar compression fractures, and possible wrist fractures from outstretched hands","Head injury only due to the height of the fall","Isolated hip fractures from ground impact"],correct:[1],points:1},
  {section:"Secondary Assessment",type:"best2",stem:"Which TWO of the following are normal physiological changes in geriatric patients that can mask serious illness or injury?",options:["A blunted heart rate response to pain and blood loss making tachycardia unreliable as a shock indicator","Increased pain sensitivity making even minor injuries feel severe","Reduced ability to mount a fever in response to serious infection","Increased blood volume improving tolerance to hemorrhage","Greater bone density reducing fracture risk from ground-level falls"],correct:[0,2],points:1},

  // ── PATIENT TREATMENT & TRANSPORT (38 questions) ──────────────────────────
  // Cardiac/CPR (8)
  {section:"Patient Treatment — Cardiac & Resuscitation",type:"mc",stem:"You arrive to find a 72-year-old male unresponsive on his kitchen floor. He is not breathing and has no pulse. Your FIRST action after confirming the scene is safe is:",options:["Apply the AED and analyze the rhythm","Begin high-quality chest compressions","Open the airway and deliver two rescue breaths","Call for ALS backup before touching the patient"],correct:[1],points:1},
  {section:"Patient Treatment — Cardiac & Resuscitation",type:"mc",stem:"To minimize interruptions during CPR, chest compressions should be paused for no more than:",options:["5 seconds","10 seconds","20 seconds","30 seconds"],correct:[1],points:1},
  {section:"Patient Treatment — Cardiac & Resuscitation",type:"mc",stem:"A 52-year-old female calls 911 reporting indigestion, nausea, jaw pain, and unusual fatigue that started an hour ago. She denies chest pain. The MOST appropriate interpretation is:",options:["Likely gastrointestinal illness; transport non-emergent","These are atypical AMI symptoms common in women; treat as cardiac emergency","Anxiety-related somatic complaints; reassure the patient","Musculoskeletal jaw strain; no cardiac concern"],correct:[1],points:1},
  {section:"Patient Treatment — Cardiac & Resuscitation",type:"mc",stem:"You and your partner arrive to find a 3-month-old infant in cardiac arrest. Which compression technique is preferred for two-rescuer infant CPR and why?",options:["Two fingers on the sternum — provides adequate depth while minimizing chest wall trauma","Two thumbs encircling the chest with both hands around the thorax — generates higher peak pressures and better coronary perfusion than the two-finger technique","Heel of one hand with the other hand supporting the back — mirrors the adult one-hand technique scaled to size","The same two-hand adult technique scaled to the infant's size — consistency across age groups improves performance under stress"],correct:[1],explain:"The two-thumb encircling technique is preferred for two-rescuer infant CPR because research shows it generates superior coronary perfusion pressures compared to the two-finger method. The two-finger technique is acceptable when only one rescuer is present.",points:1},
  {section:"Patient Treatment — Cardiac & Resuscitation",type:"mc",stem:"Which of the following is TRUE regarding use of an AED on a child between 1 and 8 years old?",options:["AEDs should never be used on children under 8","Pediatric pads or a dose attenuator should be used if available; if not, adult pads may be used","Adult AED settings are always safe for all pediatric patients","AEDs cannot analyze pediatric rhythms accurately"],correct:[1],points:1},
  {section:"Patient Treatment — Cardiac & Resuscitation",type:"mc",stem:"A patient has a pacemaker implanted beneath the skin of the upper left chest. When applying AED pads, you should:",options:["Place the left pad directly over the pacemaker for best contact","Place the AED pad at least 1 inch away from the implanted device","Withhold the AED and use manual CPR only","Remove the pacemaker before using the AED"],correct:[1],points:1},
  {section:"Patient Treatment — Cardiac & Resuscitation",type:"best2",stem:"Which TWO of the following are signs of obvious death that justify withholding resuscitation efforts?",options:["Rigor mortis with dependent lividity","Cyanosis of the lips and fingertips","Decapitation or obvious mortal injury incompatible with survival","Unresponsiveness without a palpable pulse","An SpO2 of 0% on the pulse oximeter"],correct:[0,2],points:1},
  {section:"Patient Treatment — Cardiac & Resuscitation",type:"order",stem:"You are performing CPR on an adult cardiac arrest patient when your partner arrives with the AED. Place the following AED integration steps in the correct order:",items:["Resume CPR immediately for 2 minutes before the next rhythm analysis","Power on the AED and apply pads while your partner continues compressions","Minimize the pause — clear the patient and deliver the shock if advised within 10 seconds","Allow the AED to analyze the rhythm — stop CPR only during analysis","Begin CPR with compressions immediately upon patient contact while the AED is retrieved"],order:[4,1,3,2,0],explain:"Compressions first while AED is retrieved → pads applied with minimal interruption → analyze → shock if advised within 10 seconds → immediately resume CPR for 2 minutes before re-analysis.",points:1},
  // Medical (10)
  {section:"Patient Treatment — Medical Emergencies",type:"mc",stem:"A 44-year-old female is confused and diaphoretic. Her husband states she is a type 1 diabetic and took her insulin but skipped breakfast. Her blood glucose reads 38 mg/dL. She is confused but conscious. The MOST appropriate intervention is:",options:["Administer high-flow oxygen and transport without glucose","Administer oral glucose gel and reassess mental status","Place her supine and monitor for seizure activity","Withhold glucose until ALS arrives to administer IV dextrose"],correct:[1],points:1},
  {section:"Patient Treatment — Medical Emergencies",type:"mc",stem:"During an active generalized tonic-clonic seizure, the MOST important role of the EMR is:",options:["Restrain the patient to prevent injury during convulsions","Insert an OPA immediately to protect the airway","Protect the patient from injury, time the seizure, and prepare to manage the airway in the postictal phase","Administer oral glucose in case hypoglycemia is the cause"],correct:[2],points:1},
  {section:"Patient Treatment — Medical Emergencies",type:"mc",stem:"A diabetic patient becomes unresponsive after you administered oral glucose. The MOST appropriate next action is:",options:["Administer a second dose of oral glucose","Protect the airway, support ventilations as needed, and request ALS","Position prone and wait for natural recovery","Apply a NRB mask and transport without further intervention"],correct:[1],points:1},
  {section:"Patient Treatment — Medical Emergencies",type:"mc",stem:"A patient with a history of asthma is in severe respiratory distress, wheezing audibly, and has an SpO2 of 87%. She has already used her rescue inhaler twice with no improvement. The MOST appropriate action is:",options:["Advise her to use the inhaler a third time and monitor","Administer high-flow oxygen, assist ventilations if she deteriorates, and transport urgently","Apply a nasal cannula at 2 LPM and reassess in 10 minutes","Position supine to reduce respiratory effort"],correct:[1],points:1},
  {section:"Patient Treatment — Medical Emergencies",type:"mc",stem:"A 68-year-old male with heart failure presents with sudden onset severe dyspnea, productive cough with blood-tinged sputum, and sits bolt upright. His SpO2 is 84%. He is MOST likely experiencing:",options:["Tension pneumothorax","Acute exacerbation of COPD","Acute pulmonary edema from left heart failure","Pulmonary embolism"],correct:[2],explain:"Sudden dyspnea, orthopnea, pink frothy sputum, and low SpO2 in a patient with known heart failure is the classic presentation of acute pulmonary edema.",points:1},
  {section:"Patient Treatment — Medical Emergencies",type:"mc",stem:"A patient was stung by multiple bees and now has generalized urticaria, stridor, and a blood pressure of 70/40. The treatment priority is:",options:["Diphenhydramine by mouth, high-flow oxygen, and transport","Epinephrine administration, high-flow oxygen, and immediate transport with ALS intercept if possible","Apply a constricting band above the sting site and ice packs","Position supine, apply oxygen, and monitor blood pressure every 5 minutes"],correct:[1],points:1},
  {section:"Patient Treatment — Medical Emergencies",type:"mc",stem:"A patient took an unknown quantity of opioid pain pills. He is unresponsive with a respiratory rate of 4 per minute and pinpoint pupils. After opening the airway, the MOST important intervention is:",options:["Apply a NRB mask and transport","Begin BVM ventilation at 10 to 12 breaths per minute","Perform sternal rub to stimulate breathing","Administer oral activated charcoal"],correct:[1],points:1},
  {section:"Patient Treatment — Medical Emergencies",type:"mc",stem:"When approaching a patient with a behavioral emergency who is agitated and yelling, the MOST important safety principle is:",options:["Approach quickly and confidently to establish control","Stand directly in front of the patient to make eye contact and demonstrate authority","Maintain a safe distance, keep an exit available, and use calm verbal de-escalation","Physically restrain the patient before assessment to protect everyone on scene"],correct:[2],points:1},
  {section:"Patient Treatment — Medical Emergencies",type:"best2",stem:"Which TWO of the following are features of hyperglycemic emergencies (DKA) that distinguish them from hypoglycemia?",options:["Gradual onset over hours to days","Sudden onset within minutes","Fruity or acetone breath odor","Diaphoresis and pallor","Trembling and agitation from sympathetic activation"],correct:[0,2],points:1},
  {section:"Patient Treatment — Medical Emergencies",type:"matching",stem:"Match each medical emergency with its priority prehospital intervention.",pairs:[{term:"Anaphylaxis with hypotension",def:"Epinephrine auto-injector, high-flow oxygen, supine position, rapid transport"},{term:"Opioid overdose with apnea",def:"BVM ventilation; request ALS for naloxone administration"},{term:"Acute severe asthma",def:"High-flow oxygen, assist with prescribed bronchodilator, position of comfort, urgent transport"},{term:"Acute behavioral emergency",def:"Scene safety, calm de-escalation, do not restrain without police, protect patient and crew"},{term:"Suspected stroke",def:"Cincinnati Stroke Scale, note time of onset, high-flow oxygen, rapid transport to stroke center"}],points:1},
  // Trauma (10)
  {section:"Patient Treatment — Trauma",type:"mc",stem:"An adult patient has partial-thickness burns to the entire anterior left leg and the perineum. Using the Rule of Nines, the approximate total BSA burned is:",options:["10% (9% anterior leg + 1% perineum)","18% (entire leg front and back)","14%","4.5% (half of one leg only)"],correct:[0],explain:"The Rule of Nines assigns 18% to the entire leg (9% anterior, 9% posterior). Only the anterior surface is burned here, giving 9%. The perineum accounts for 1%. Total: 10%.",points:1},
  {section:"Patient Treatment — Trauma",type:"mc",stem:"Which of the following burn wounds requires the MOST urgent transport to a burn center?",options:["Superficial burns to the forearm in an adult with no other injuries","Partial-thickness burns covering 25% BSA in a 6-year-old child","Minor burns to the upper back in a healthy 30-year-old","A small full-thickness burn less than 1% BSA on the thigh"],correct:[1],points:1},
  {section:"Patient Treatment — Trauma",type:"mc",stem:"Management of a patient with an impaled object in the eye should include:",options:["Removing the object quickly to prevent pressure buildup","Stabilizing the object with bulky dressings, covering both eyes, and transporting","Applying direct pressure over the object to control bleeding","Flushing the eye with saline and removing the object carefully"],correct:[1],points:1},
  {section:"Patient Treatment — Trauma",type:"mc",stem:"Which is the correct approach to a chemical burn?",options:["Neutralize the chemical with the opposing acid or base before irrigating","Brush off dry chemicals if present, then flush with large amounts of water for at least 20 minutes","Apply a moist dressing without flushing to prevent spreading the chemical","Cover with a dry sterile dressing and transport without flushing"],correct:[1],points:1},
  {section:"Patient Treatment — Trauma",type:"best2",stem:"Which TWO of the following are correct principles when managing a traumatic amputation?",options:["Control bleeding with direct pressure and tourniquet if needed for an extremity","Attempt to surgically reattach the part at the scene using available supplies","Wrap the amputated part in a moist sterile dressing, place in a plastic bag, and keep cool without direct contact with ice","Discard the amputated part if it appears severely damaged","Transport the amputated part separately on a different unit"],correct:[0,2],points:1},
  {section:"Patient Treatment — Trauma",type:"mc",stem:"You are assessing a trauma patient with a large arterial wound to the thigh that is bleeding profusely. Which action takes priority over airway management in the current prehospital trauma assessment model?",options:["Perform a rapid head-to-toe secondary assessment before any intervention","Control the catastrophic hemorrhage immediately — massive bleeding is addressed before the airway","Open the airway first using a head-tilt chin-lift before addressing any bleeding","Assess circulation by checking the radial pulse before controlling external bleeding"],correct:[1],explain:"Current trauma assessment follows a CABC sequence — Catastrophic hemorrhage control comes before Airway. Uncontrolled massive hemorrhage kills faster than most airway problems. A tourniquet or wound packing takes priority, then airway.",points:1},
  {section:"Patient Treatment — Trauma",type:"mc",stem:"An open femur fracture has a bone end visible through the wound. The MOST appropriate management is:",options:["Attempt to push the bone end back below the skin before splinting","Control bleeding with direct pressure, do not push bone back, apply traction splint if appropriate, and transport","Thoroughly irrigate the wound with water before dressing and splinting","Disregard wound management and focus only on splinting the fracture"],correct:[1],points:1},
  {section:"Patient Treatment — Trauma",type:"mc",stem:"Which of the following mechanisms should prompt spinal precautions even in a patient who is ambulatory and denies neck pain?",options:["A low-speed rear-end collision with no airbag deployment","A fall from standing height in an elderly patient with osteoporosis","A minor sports collision with localized shoulder pain only","Tripping over a curb with a fall onto the outstretched hands"],correct:[1],points:1},
  {section:"Patient Treatment — Trauma",type:"best2",stem:"Which TWO of the following are correct principles for splinting a fracture in the prehospital setting?",options:["Splint the injury in the position found; do not straighten angulated fractures unless CSM is compromised","Always straighten all angulated fractures to the anatomical position before splinting","Reassess CSM before and after applying the splint","Apply the tightest possible wrap to prevent movement","Splint only after IV access is established"],correct:[0,2],points:1},
  {section:"Patient Treatment — Trauma",type:"matching",stem:"Match each thoracic injury with its key assessment finding.",pairs:[{term:"Simple pneumothorax",def:"Absent or decreased breath sounds on the affected side without hemodynamic compromise"},{term:"Tension pneumothorax",def:"Absent breath sounds on one side plus tracheal deviation, JVD, and hypotension"},{term:"Hemothorax",def:"Dullness to percussion on the affected side; blood accumulation in the pleural space"},{term:"Flail chest",def:"Paradoxical chest wall movement; multiple consecutive rib fractures causing a free-floating segment"},{term:"Cardiac tamponade",def:"Beck's triad: hypotension, distended neck veins, muffled heart sounds"}],points:1},
  // OB/Peds/Geri (7)
  {section:"Patient Treatment — OB, Peds & Geriatrics",type:"mc",stem:"You arrive to find a patient at 38 weeks pregnant in active labor. You can see the baby's head crowning. The MOST appropriate action is:",options:["Transport immediately — do not attempt field delivery","Prepare for an imminent delivery, support the head, and guide the delivery","Place the mother in the left lateral recumbent position and delay delivery","Apply oxygen only and wait for ALS"],correct:[1],points:1},
  {section:"Patient Treatment — OB, Peds & Geriatrics",type:"mc",stem:"After a field delivery, the newborn is limp, not breathing, and centrally cyanotic. The FIRST intervention is:",options:["Begin CPR immediately at 30:2","Dry and stimulate the newborn vigorously, position the airway, and reassess","Administer blow-by oxygen and wait 60 seconds before intervening","Clamp and cut the umbilical cord before assessment"],correct:[1],points:1},
  {section:"Patient Treatment — OB, Peds & Geriatrics",type:"mc",stem:"Which of the following is the MOST common cause of cardiac arrest in pediatric patients?",options:["Ventricular fibrillation from a primary cardiac event","Respiratory failure leading to hypoxic cardiac arrest","Sudden coronary artery occlusion","Arrhythmia from congenital heart disease"],correct:[1],points:1},
  {section:"Patient Treatment — OB, Peds & Geriatrics",type:"mc",stem:"When assessing an elderly patient after a ground-level fall, which consideration is MOST important?",options:["Ground-level falls in the elderly are low-energy and rarely cause serious injury","Osteoporosis, anticoagulant medications, and reduced physiological reserve increase the risk of serious injury even from minor mechanisms","Elderly patients should only be treated for visible external injuries","Vital signs in elderly patients are always reliable indicators of injury severity"],correct:[1],points:1},
  {section:"Patient Treatment — OB, Peds & Geriatrics",type:"mc",stem:"A pregnant patient at 32 weeks with no prior epilepsy history collapses with a sudden seizure. The MOST likely cause is:",options:["Hypoglycemia from gestational diabetes","Eclampsia — seizures related to severe hypertension of pregnancy","A primary seizure disorder triggered by the stress of pregnancy","Syncope misidentified as a seizure"],correct:[1],points:1},
  {section:"Patient Treatment — OB, Peds & Geriatrics",type:"mc",stem:"After delivery, if the umbilical cord is wrapped around the baby's neck (nuchal cord), the EMR should:",options:["Cut the cord immediately before delivering the shoulders","Attempt to slip the cord over the baby's head or create a loop for the baby to somersault through","Leave the cord in place and transport without attempting to move it","Clamp the cord in two places and cut before delivering the body"],correct:[1],points:1},
  {section:"Patient Treatment — OB, Peds & Geriatrics",type:"best2",stem:"Which TWO actions are MOST appropriate for a 28-year-old pregnant patient at 36 weeks with sudden severe headache, visual changes, RUQ pain, and a BP of 168/110?",options:["Position the patient in the left lateral recumbent position to relieve aortocaval compression","Administer oral aspirin to reduce platelet aggregation and lower blood pressure","Transport urgently — this presentation is consistent with severe preeclampsia requiring immediate obstetric care","Reassure the patient and monitor vitals on scene for 15 minutes before transporting","Apply high-flow oxygen via NRB only and defer transport until blood pressure normalizes"],correct:[0,2],explain:"Severe preeclampsia (BP ≥160/110 with symptoms) is a maternal emergency requiring immediate transport. Left lateral positioning improves placental perfusion. Aspirin is not appropriate prehospital, and delaying transport is dangerous.",points:1},

// ── STATE ────────────────────────────────────────────
// Pre-fill student name from portal URL param
const _urlParams = new URLSearchParams(window.location.search);
const _portalStudent = decodeURIComponent(_urlParams.get('student') || '').trim();
 
let phase        = "intro";
let studentName  = _portalStudent || "";
let current      = 0;
let answers      = Array(questions.length).fill(null);
let matchSels    = {};      // "qIdx-termIdx" -> def string
let shuffledDefs = {};      // qIdx -> shuffled def array
let timeLeft     = TOTAL_TIME;
let timerInterval= null;
let dragData     = null;    // {def, fromTermIdx}
let startTime    = null;
 
// ── SHUFFLE ──────────────────────────────────────────
function shuffle(arr) { return [...arr].sort(() => Math.random()-0.5); }
function initShuffles() {
  questions.forEach((q,i) => {
    if (q.type === "matching") shuffledDefs[i] = shuffle(q.pairs.map(p=>p.def));
    if (q.type === "order") answers[i] = answers[i] || q.items.map((_,j)=>j); // init default order
  });
}
 
// ── SCORING ──────────────────────────────────────────
function scoreQuestion(q, ans) {
  if (ans === undefined || ans === null) return false;
  if (q.type === "mc")      return Array.isArray(ans) && ans[0] === q.correct[0];
  if (q.type === "best2")   return Array.isArray(ans) && ans.length===2 && ans.every(a=>q.correct.includes(a));
  if (q.type === "matching") return Array.isArray(ans) && q.pairs.every((p,ti)=>ans[ti]===p.def);
  if (q.type === "order")   return Array.isArray(ans) && q.order.every((origIdx,pos)=>ans[pos]===origIdx);
  return false;
}
function calcScore() {
  let score=0, total=0;
  questions.forEach((q,i)=>{ total+=q.points; if(scoreQuestion(q,answers[i])) score+=q.points; });
  return {score,total};
}
 
// ── SAVE MATCHING ANS ────────────────────────────────
function saveMatchingAnswers(qIdx) {
  const q = questions[qIdx];
  answers[qIdx] = q.pairs.map((_,ti)=>matchSels[`${qIdx}-${ti}`]||null);
}
 
// ── TIMER ────────────────────────────────────────────
function startTimer() {
  startTime = Date.now();
  timerInterval = setInterval(()=>{
    timeLeft--;
    updateTimerUI();
    if (timeLeft <= 0) { clearInterval(timerInterval); finishExam(); }
  }, 1000);
}
function updateTimerUI() {
  const m = Math.floor(timeLeft/60), s = timeLeft%60;
  const str = `${m}:${String(s).padStart(2,"0")}`;
  const color = timeLeft<60?"#ef4444":timeLeft<180?"#b45309":"#22c55e";
  document.querySelectorAll(".timer-text").forEach(el=>{ el.textContent=str; el.style.color=color; });
  document.querySelectorAll(".timer-dot").forEach(el=>{ el.style.background=color; el.classList.toggle("pulse",timeLeft<60); });
  document.querySelectorAll(".timer-bar-fill").forEach(el=>{ el.style.width=`${(timeLeft/TOTAL_TIME)*100}%`; el.style.background=color; });
}
 
// ── SUBMIT TO GOOGLE SHEETS ──────────────────────────
// Uses GET with ?payload= because Apps Script cross-origin POST is blocked
// by CORS preflight. GET requests follow the redirect and reach doGet().
async function submitToFirebase(subData) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 15000);
  try {
    const url = `https://firestore.googleapis.com/v1/projects/${FB_CONFIG.projectId}/databases/(default)/documents/examResults`;
    const answersStr = JSON.stringify(subData.answersData, (k,v) => v === undefined ? null : v);
    const body = {
      fields: {
        examLabel:  {stringValue: subData.examLabel},
        category:   {stringValue: EXAM_CATEGORY},
        name:       {stringValue: subData.name},
        score:      {integerValue: String(isNaN(subData.score)    ? 0 : subData.score)},
        total:      {integerValue: String(isNaN(subData.total)    ? 0 : subData.total)},
        pct:        {integerValue: String(isNaN(subData.pct)      ? 0 : subData.pct)},
        timeUsed:   {integerValue: String(isNaN(subData.timeUsed) ? 0 : subData.timeUsed)},
        submittedAt:{stringValue: subData.submittedAt},
        answersData:{stringValue: answersStr},
      }
    };
    const resp = await fetch(url + `?key=${FB_CONFIG.apiKey}`, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(body),
      signal: controller.signal,
    });
    clearTimeout(timeout);
    if (!resp.ok) { const errText = await resp.text(); throw new Error(errText); }
    return { success: true };
  } catch(e) {
    clearTimeout(timeout);
    console.error("Firebase submit error:", e);
    return { success: false, error: e.toString() };
  }
}
 
// ── FINISH EXAM ──────────────────────────────────────
async function finishExam() {
  clearInterval(timerInterval);
  const {score,total} = calcScore();
  const pct = Math.round((score/total)*100);
  const timeUsed = TOTAL_TIME - timeLeft;
  const questionResults = questions.map((q,i)=>scoreQuestion(q,answers[i]));
 
  const answersData = questions.map((q, i) => {
    const given = answers[i] !== undefined ? answers[i] : null;
    const correct = q.correct !== undefined ? q.correct
                  : q.order   !== undefined ? q.order
                  : q.pairs   !== undefined ? q.pairs.map(p => p.def)
                  : null;
    return { given, correct };
  });
  const subData = {
    examLabel: EXAM_LABEL,
    name: studentName,
    score, total, pct, timeUsed,
    answersData,
    submittedAt: new Date().toISOString(),
  };
 
  phase = "submitting";
  render();

  try {
    const result = await submitToFirebase(subData);
    window._submitResult = result;
  } catch(e) {
    console.error('finishExam error:', e);
    window._submitResult = { success: false, error: e.toString() };
  }
  phase = "results";
  window._examScore = {score,total,pct};
  window._questionResults = questionResults;
  render();
}

// ── RENDER ───────────────────────────────────────────
function render() {
  const root = document.getElementById("root");
  if (phase === "intro")       root.innerHTML = renderIntro();
  else if (phase === "submitting") root.innerHTML = renderSubmitting();
  else if (phase === "results") root.innerHTML = renderResults();
  else                          root.innerHTML = renderExam();
  attachEvents();
}
