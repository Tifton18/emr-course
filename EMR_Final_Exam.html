            .map(([l,v])=>`<div class="info-row"><span class="info-label">${l}</span><span class="info-val">${v}</span></div>`).join("")}
        </div>
        <p class="intro-instructions">For multiple choice, select the single best answer. For Best 2 of 5, select exactly two answers. For matching, drag definitions from the bank and drop them onto the correct terms.</p>
        <label class="name-label">Student Name</label>
        <input class="name-input ${_portalStudent ? 'has-value' : ''}" id="nameInput" type="text" 
          placeholder="Enter your full name to begin..." autocomplete="off"
          ${_portalStudent ? `value="${_portalStudent}" readonly style="background:#fef9ee;color:#1e3a5f;cursor:default;border-color:#93c5fd;"` : ''}>
        <br>
        <button class="btn-begin ${_portalStudent ? 'active' : ''}" id="beginBtn" ${_portalStudent ? '' : 'disabled'}>Begin Exam</button>
      </div>
    </div>`;
}
 
function renderSubmitting() {
  return `
    <div style="min-height:100vh;background:#1a2744;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px;font-family:Georgia,serif;">
      <div class="submitting-spinner"></div>
      <div class="submitting-text">Submitting your exam…</div>
    </div>`;
}
 
function renderResults() {
  const {score,total,pct} = window._examScore;
  const passed = pct >= 70;
  const qr = window._questionResults;
  const sr = window._submitResult;
 
  let statusHtml = "";
  if (sr && !sr.noUrl) {
    statusHtml = sr.success
      ? `<div class="submit-status success">✓ Your results have been submitted to your instructor.</div>`
      : `<div class="submit-status error">⚠ Could not reach the server. Please notify your instructor. Your score: ${pct}% (${score}/${total})</div>`;
  }
 
  const reviewRows = questions.map((q,i)=>{
    const correct = qr[i];
    let correctAns = "";
    if (!correct) {
      if (q.type==="mc" && q.options) correctAns = `Correct: ${LETTERS[q.correct[0]]}. ${q.options[q.correct[0]]}`;
      else if (q.type==="best2" && q.options) correctAns = `Correct: ${q.correct.map(c=>`${LETTERS[c]}. ${q.options[c]}`).join(" & ")}`;
      else if (q.type==="order") correctAns = `Correct order: ${q.order.map((origIdx,pos)=>`${pos+1}. ${q.items[origIdx]}`).join(" → ")}`;
      else if (q.type==="matching") correctAns = "See correct matches in the review above";
      else if (q.type==="build") correctAns = "See correct order in the review above";
    }
    return `
      <div class="result-row">
        <div class="result-badge ${correct?"correct":"wrong"}">${correct?"✓":"✗"}</div>
        <div style="flex:1">
          <div class="result-stem"><strong style="color:#fca5a5">Q${i+1}.</strong> ${q.stem.length>100?q.stem.slice(0,100)+"…":q.stem}</div>
          ${correctAns?`<div class="result-correct-ans">${correctAns}</div>`:""}
        </div>
        <div class="result-pts" style="color:${correct?"#81c784":"#ef9a9a"}">${correct?"+"+q.points:"0"}</div>
      </div>`;
  }).join("");
 
  return `
    <div class="results-wrap" style="background:${passed?"linear-gradient(135deg,#0d2818,#1b4332,#0d2818)":"linear-gradient(135deg,#2d0a0a,#4a1010,#2d0a0a)"}">
      <div class="results-inner">
        ${statusHtml}
        <div class="results-hero">
          <div class="results-icon">${passed?"✓":"✗"}</div>
          <div class="results-name">${studentName}</div>
          <div class="results-pct">${pct}%</div>
          <div class="results-verdict" style="color:${passed?"#81c784":"#ef9a9a"}">${passed?"PASSED":"DID NOT PASS"}</div>
          <div class="results-detail">${score} / ${total} points · Passing score: 70% (${Math.ceil(total*0.7)} pts)</div>
        </div>
        <div class="results-card">
          <div class="results-card-title">Question Review</div>
          ${reviewRows}
        </div>
      </div>
    </div>`;
}
 
function renderExam() {
  const q = questions[current];
  const sc = SECTION_COLORS[q.section] || {bg:"#1a1a2e",accent:"#b91c1c"};
  const progress = ((current+1)/questions.length)*100;
  const ans = answers[current] || [];
 
  let questionBody = "";
  if (q.type==="mc" || q.type==="best2") {
    const hint = q.type==="best2"
      ? `<div class="best2-hint">★ Select the TWO best answers ${ans.length>0?"("+ans.length+"/2 selected)":""}</div>` : "";
    const opts = q.options.map((opt,idx)=>{
      const sel = ans.includes(idx);
      return `<button class="option-btn ${q.type==="best2"?"best2":""} ${sel?"selected":""}" data-idx="${idx}">
        <div class="option-indicator">${LETTERS[idx]}</div>
        <div class="option-text">${opt}</div>
      </button>`;
    }).join("");
    questionBody = `<div class="options-list">${hint}${opts}</div>`;
 
  } else if (q.type==="matching") {
    const defs = shuffledDefs[current] || q.pairs.map(p=>p.def);
    const usedDefs = new Set(Object.entries(matchSels).filter(([k])=>k.startsWith(current+"-")).map(([,v])=>v));
    const bankDefs = defs.filter(d=>!usedDefs.has(d));
 
    const bankChips = bankDefs.map(def=>`<div class="def-chip" draggable="true" data-def="${encodeURIComponent(def)}">${def}</div>`).join("") ||
      `<div class="def-bank-empty">All definitions assigned</div>`;
 
    const termRows = q.pairs.map((pair,ti)=>{
      const assigned = matchSels[`${current}-${ti}`];
      return `
        <div class="term-row ${assigned?"assigned":""}" data-term-idx="${ti}">
          <div class="term-name"><span>${pair.term}</span></div>
          <div class="term-drop">
            ${assigned
              ? `<div class="def-chip" draggable="true" data-def="${encodeURIComponent(assigned)}" data-from-term="${ti}" style="margin:0;width:100%">${assigned}</div>`
              : `<span class="term-placeholder">— drag a definition here —</span>`}
          </div>
        </div>`;
    }).join("");
 
    questionBody = `
      <div class="match-instructions"><strong>Drag</strong> a definition from the bank and <strong>drop</strong> it onto the matching term. Drag a placed definition back to the bank to unassign it.</div>
      <div class="bank-label">Definition Bank</div>
      <div class="def-bank" id="defBank">${bankChips}</div>
      <div class="terms-label">Terms — Drop definitions here</div>
      <div class="term-rows">${termRows}</div>`;
  } else if (q.type==="order") {
    const currentOrder = answers[current] || q.items.map((_,i)=>i);
    const orderedItems = currentOrder.map((origIdx, pos) => {
      return `<div class="build-item" data-pos="${pos}" data-orig="${origIdx}">
        <div class="build-pos">${pos+1}</div>
        <div class="build-handle">⠿</div>
        <div style="flex:1;line-height:1.5">${q.items[origIdx]}</div>
      </div>`;
    }).join("");
    questionBody = `
      <div class="order-instructions"><strong>Drag</strong> the steps into the correct order — #1 at the top, last step at the bottom.</div>
      <div class="build-list" id="buildList">${orderedItems}</div>`;
  }

  const typeBadge = q.type==="best2"
    ? `<span class="q-badge" style="background:rgba(180,83,9,0.2);color:#fcd34d;border:1px solid #b45309">SELECT 2</span>`
    : q.type==="order"
    ? `<span class="q-badge" style="background:rgba(185,28,28,0.2);color:#fca5a5;border:1px solid #b91c1c">SEQUENCE</span>`
    : ``;

 
  const dots = questions.map((_,i)=>
    `<div class="dot ${i===current?"current":answers[i]?"answered":""}" style="width:${i===current?20:10}px" data-dot="${i}"></div>`
  ).join("");
 
  const navRight = current < questions.length-1
    ? `<button class="btn-next" id="nextBtn">Next →</button>`
    : `<button class="btn-submit-exam" id="submitExamBtn">Submit Exam</button>`;
 
  return `
    <div>
      <div class="topbar">
        <div class="topbar-inner">
          <div class="progress-wrap">
            <div class="progress-bar"><div class="progress-fill" style="width:${progress}%;background:${sc.accent}"></div></div>
            <span class="progress-text">${current+1} / ${questions.length}</span>
          </div>
          <div class="timer-box" style="border-color:#b45309">
            <div class="timer-dot" style="background:#22c55e"></div>
            <span class="timer-text" style="color:#22c55e">25:00</span>
          </div>
          <button class="btn-submit-top" id="submitTopBtn" style="background:${sc.accent}">Submit</button>
        </div>
        <div class="timer-bar"><div class="timer-bar-fill" style="width:100%;background:#22c55e"></div></div>
      </div>
 
      <div class="exam-wrap">
        <div class="section-badge" style="background:#1e3a5f;border-left:3px solid #b45309;padding-left:12px">
          <div class="section-dot" style="background:${sc.accent}"></div>
          <span class="section-label" style="color:#fcd34d;font-weight:600">${q.section}</span>
        </div>
 
        <div class="q-header">
          <span class="q-label">QUESTION</span>
          <span class="q-number">${current+1}</span>
          ${typeBadge}
          <span class="q-points">${q.points} pt</span>
        </div>
 
        <div class="q-stem">${q.stem}</div>
        ${questionBody}
 
        <div class="nav-bar">
          <button class="btn-prev" id="prevBtn" ${current===0?"disabled":""}>← Previous</button>
          <div class="dots">${dots}</div>
          ${navRight}
        </div>
      </div>
    </div>`;
}
 
// ── EVENT BINDING ────────────────────────────────────
function attachEvents() {
  // INTRO
  const nameInput = document.getElementById("nameInput");
  const beginBtn  = document.getElementById("beginBtn");
  if (nameInput) {
    nameInput.value = studentName;
    nameInput.addEventListener("input", e=>{
      studentName = e.target.value.trim();
      nameInput.classList.toggle("has-value", !!studentName);
      beginBtn.disabled = !studentName;
      beginBtn.classList.toggle("active", !!studentName);
    });
    nameInput.addEventListener("keydown", e=>{ if(e.key==="Enter"&&studentName) beginExam(); });
  }
  if (beginBtn) {
    beginBtn.classList.toggle("active", !!studentName);
    beginBtn.addEventListener("click", ()=>{ if(studentName) beginExam(); });
  }
 
  // EXAM — MC / Best2
  document.querySelectorAll(".option-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const idx = parseInt(btn.dataset.idx);
      const q = questions[current];
      if (q.type==="mc") {
        answers[current] = [idx];
      } else {
        const prev = answers[current] || [];
        if (prev.includes(idx)) answers[current] = prev.filter(i=>i!==idx);
        else if (prev.length<2) answers[current] = [...prev,idx];
        else answers[current] = [prev[1],idx];
      }
      render();
    });
  });
 
  // ── MATCHING — touch/mouse drag ──────────────────────────────────────────
  let draggingEl = null;
  let dragGhost  = null;
  let dragOffX   = 0, dragOffY = 0;

  function createGhost(el) {
    const ghost = el.cloneNode(true);
    const rect  = el.getBoundingClientRect();
    ghost.style.cssText = `position:fixed;left:${rect.left}px;top:${rect.top}px;width:${rect.width}px;
      opacity:0.85;pointer-events:none;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,0.25);
      transform:scale(1.03);transition:none;margin:0;`;
    document.body.appendChild(ghost);
    return ghost;
  }

  function moveGhost(clientX, clientY) {
    if (!dragGhost) return;
    dragGhost.style.left = (clientX - dragOffX) + 'px';
    dragGhost.style.top  = (clientY - dragOffY) + 'px';
  }

  function getClientXY(e) {
    if (e.touches && e.touches.length > 0) return { x: e.touches[0].clientX, y: e.touches[0].clientY };
    if (e.changedTouches && e.changedTouches.length > 0) return { x: e.changedTouches[0].clientX, y: e.changedTouches[0].clientY };
    return { x: e.clientX, y: e.clientY };
  }

  function elementFromPoint(x, y) {
    if (dragGhost) dragGhost.style.display = 'none';
    const el = document.elementFromPoint(x, y);
    if (dragGhost) dragGhost.style.display = '';
    return el;
  }

  function chipDragStart(e, chip) {
    e.preventDefault();
    draggingEl = chip;
    chip.classList.add('dragging');
    const def = decodeURIComponent(chip.dataset.def);
    const fromTerm = chip.dataset.fromTerm !== undefined ? parseInt(chip.dataset.fromTerm) : null;
    dragData = { def, fromTermIdx: fromTerm };
    const { x, y } = getClientXY(e);
    const rect = chip.getBoundingClientRect();
    dragOffX = x - rect.left;
    dragOffY = y - rect.top;
    dragGhost = createGhost(chip);
  }

  function chipDragMove(e) {
    if (!draggingEl) return;
    e.preventDefault();
    const { x, y } = getClientXY(e);
    moveGhost(x, y);
    // Highlight drop target
    document.querySelectorAll('.term-row,.def-bank').forEach(el => el.classList.remove('dragover'));
    const target = elementFromPoint(x, y);
    if (target) {
      const row = target.closest('.term-row');
      const bank = target.closest('.def-bank');
      if (row) row.classList.add('dragover');
      else if (bank) bank.classList.add('dragover');
    }
  }

  function chipDragEnd(e) {
    if (!draggingEl) return;
    const { x, y } = getClientXY(e);
    // Find drop target
    const target = elementFromPoint(x, y);
    document.querySelectorAll('.term-row,.def-bank').forEach(el => el.classList.remove('dragover'));
    if (dragGhost) { dragGhost.remove(); dragGhost = null; }
    draggingEl.classList.remove('dragging');
    draggingEl = null;
    if (!dragData) return;
    const { def, fromTermIdx } = dragData; dragData = null;
    if (target) {
      const row = target.closest('.term-row');
      const bank = target.closest('.def-bank');
      if (row) {
        const termIdx = parseInt(row.dataset.termIdx);
        if (fromTermIdx !== null && fromTermIdx !== undefined) delete matchSels[`${current}-${fromTermIdx}`];
        Object.keys(matchSels).forEach(k => { if (matchSels[k] === def) delete matchSels[k]; });
        matchSels[`${current}-${termIdx}`] = def;
        saveMatchingAnswers(current);
        render();
      } else if (bank) {
        if (fromTermIdx !== null && fromTermIdx !== undefined) {
          delete matchSels[`${current}-${fromTermIdx}`];
          saveMatchingAnswers(current);
          render();
        }
      }
    }
  }

  document.querySelectorAll('.def-chip').forEach(chip => {
    chip.addEventListener('mousedown',  e => chipDragStart(e, chip));
    chip.addEventListener('touchstart', e => chipDragStart(e, chip), { passive: false });
  });
  document.addEventListener('mousemove',  chipDragMove);
  document.addEventListener('touchmove',  chipDragMove, { passive: false });
  document.addEventListener('mouseup',    chipDragEnd);
  document.addEventListener('touchend',   chipDragEnd);

  // ── BUILD — touch/mouse drag to reorder ──────────────────────────────────
  const buildList = document.getElementById('buildList');
  if (buildList) {
    let buildDragSrcPos = null;
    let buildDraggingEl = null;
    let buildGhost      = null;
    let buildOffX = 0, buildOffY = 0;

    function buildDragStart(e, item) {
      e.preventDefault();
      buildDraggingEl = item;
      // Read live DOM position — data-pos may be stale
      const allItems = [...buildList.querySelectorAll('.build-item')];
      buildDragSrcPos = allItems.indexOf(item);
      item.classList.add('dragging');
      const { x, y } = getClientXY(e);
      const rect = item.getBoundingClientRect();
      buildOffX = x - rect.left;
      buildOffY = y - rect.top;
      buildGhost = createGhost(item);
    }

    function buildDragMove(e) {
      if (!buildDraggingEl) return;
      e.preventDefault();
      const { x, y } = getClientXY(e);
      moveGhost2(x, y);
      buildList.querySelectorAll('.build-item').forEach(i => i.classList.remove('drag-over'));
      const target = elementFromPoint2(x, y);
      if (target) {
        const item = target.closest('.build-item');
        if (item && item !== buildDraggingEl) item.classList.add('drag-over');
      }
    }

    function moveGhost2(cx, cy) {
      if (!buildGhost) return;
      buildGhost.style.left = (cx - buildOffX) + 'px';
      buildGhost.style.top  = (cy - buildOffY) + 'px';
    }

    function elementFromPoint2(x, y) {
      if (buildGhost) buildGhost.style.display = 'none';
      const el = document.elementFromPoint(x, y);
      if (buildGhost) buildGhost.style.display = '';
      return el;
    }

    function buildDragEnd(e) {
      if (!buildDraggingEl) return;
      const { x, y } = getClientXY(e);
      const target = elementFromPoint2(x, y);
      buildList.querySelectorAll('.build-item').forEach(i => i.classList.remove('drag-over'));
      if (buildGhost) { buildGhost.remove(); buildGhost = null; }
      buildDraggingEl.classList.remove('dragging');
      const srcPos = buildDragSrcPos;
      buildDraggingEl = null;
      buildDragSrcPos = null;
      if (target) {
        const item = target.closest('.build-item');
        if (item) {
          // Read live DOM order — data-pos may be stale after prior drags
          const allItems = [...buildList.querySelectorAll('.build-item')];
          const targetPos = allItems.indexOf(item);
          if (srcPos !== null && srcPos !== targetPos && targetPos !== -1) {
            const currentOrder = answers[current] || [...Array(questions[current].items.length).keys()];
            const newOrder = [...currentOrder];
            const [moved] = newOrder.splice(srcPos, 1);
            newOrder.splice(targetPos, 0, moved);
            answers[current] = newOrder;
            render();
          }
        }
      }
    }

    buildList.querySelectorAll('.build-item').forEach(item => {
      item.addEventListener('mousedown',  e => buildDragStart(e, item));
      item.addEventListener('touchstart', e => buildDragStart(e, item), { passive: false });
    });
    document.addEventListener('mousemove',  buildDragMove);
    document.addEventListener('touchmove',  buildDragMove, { passive: false });
    document.addEventListener('mouseup',    buildDragEnd);
    document.addEventListener('touchend',   buildDragEnd);
  }

  // NAV
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const submitExamBtn = document.getElementById("submitExamBtn");
  const submitTopBtn  = document.getElementById("submitTopBtn");
 
  if (prevBtn) prevBtn.addEventListener("click", ()=>{ if(current>0){ current--; render(); }});
  if (nextBtn) nextBtn.addEventListener("click", ()=>{ if(current<questions.length-1){ current++; render(); }});
  if (submitExamBtn) submitExamBtn.addEventListener("click", finishExam);
  if (submitTopBtn)  submitTopBtn.addEventListener("click",  finishExam);
 
  // Dot nav
  document.querySelectorAll(".dot").forEach(dot=>{
    dot.addEventListener("click", ()=>{ current=parseInt(dot.dataset.dot); render(); });
  });
 
  // Update timer display immediately
  updateTimerUI();
}
 
function beginExam() {
  initShuffles();
  phase = "exam";
  render();
  startTimer();
}
 
// ── BOOT ─────────────────────────────────────────────
document.addEventListener("DOMContentLoaded", ()=>{
  document.getElementById("root").innerHTML = "";
  render();
});

// ── REVIEW MODE ──────────────────────────────────────
async function startReviewMode(studentName) {
  try {
    const url = `https://firestore.googleapis.com/v1/projects/${FB_CONFIG.projectId}/databases/(default)/documents:runQuery?key=${FB_CONFIG.apiKey}`;
    const body = { structuredQuery: {
      from: [{ collectionId: 'examResults' }],
      where: { fieldFilter: { field: { fieldPath: 'name' }, op: 'EQUAL', value: { stringValue: studentName } } }
    }};
    const resp = await fetch(url, { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) });
    const rows = await resp.json();

    let match = null;
    for (const row of rows) {
      if (!row.document) continue;
      const f = row.document.fields || {};
      if (f.examLabel?.stringValue === EXAM_LABEL) { match = f; break; }
    }
    if (!match) {
      alert('No submission found for ' + studentName + ' on ' + EXAM_LABEL + '. Have them submit the exam first.');
      return;
    }

    const saved = JSON.parse(match.answersData?.stringValue || '[]');
    // Restore answers array — main exams store positional [{given, correct}, ...]
    saved.forEach((a, i) => {
      if (a && a.given !== undefined && a.given !== null) {
        answers[i] = a.given;
      }
    });

    // Restore matching answers
    questions.forEach((q, qi) => {
      if (q.type === 'matching' && saved[qi] && saved[qi].given) {
        const givenPairs = saved[qi].given;
        if (Array.isArray(givenPairs)) {
          givenPairs.forEach((def, ti) => {
            if (def) matchSels[qi + '-' + ti] = def;
          });
        }
      }
    });

    studentName = studentName;
    const timeUsed = parseInt(match.timeUsed?.integerValue || 0);
    timeLeft = Math.max(0, TOTAL_TIME - timeUsed);

    // Score and show results
    const qr = questions.map((q, i) => scoreQuestion(q, answers[i]));
    const {score, total} = calcScore();
    const pct = Math.round((score / total) * 100);
    window._examScore = {score, total, pct};
    window._questionResults = qr;
    window._submitResult = { success: true, noUrl: true };

    phase = 'results';
    render();

    // Banner
    const banner = document.createElement('div');
    banner.style.cssText = 'background:#1a2744;color:#fcd34d;border-bottom:3px solid #b45309;text-align:center;padding:10px;font-size:14px;font-weight:bold;position:sticky;top:0;z-index:999;';
    banner.textContent = '📋 Review Mode — ' + studentName + ' — ' + EXAM_LABEL;
    document.body.insertBefore(banner, document.body.firstChild);
  } catch(e) {
    console.error('Review mode error:', e);
    alert('Could not load review. Check console for details.');
  }
}

// Trigger review mode from URL params
(function() {
  const params = new URLSearchParams(window.location.search);
  const isReview = params.get('review') === '1';
  const reviewName = decodeURIComponent(params.get('name') || '').trim();
  if (isReview && reviewName) {
    window.addEventListener('DOMContentLoaded', () => { startReviewMode(reviewName); });
  }
})();
