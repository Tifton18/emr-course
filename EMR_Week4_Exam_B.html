const EXAM_LABEL      = "Week 3 Exam v2";

const TOTAL_TIME      = 25 * 60; // 25 minutes
const LETTERS         = ["A","B","C","D","E"];

// ── QUESTION DATA ────────────────────────────────────
const questions = [
  {section:"Medical Emergencies I",type:"mc",stem:"You respond to a 72-year-old female found unresponsive at home with a blood glucose of 38 mg/dL. She has a patent airway and is breathing adequately. What is the MOST appropriate next step?",options:["Administer oral glucose gel between her cheek and gum","Request ALS and maintain airway support","Position in the recovery position only","Start CPR immediately"],correct:[1],explain:"Oral glucose requires a conscious patient who can protect their airway and swallow safely. An unresponsive hypoglycemic patient cannot receive oral glucose — ALS should be requested for IV dextrose.",points:1},
  {section:"Medical Emergencies I",type:"mc",stem:"A patient is actively convulsing. Which action is the HIGHEST priority for the EMR?",options:["Insert an OPA to protect the airway","Protect the patient from injury and maintain airway positioning","Restrain the patient to prevent self-harm","Place a bite block between the teeth"],correct:[1],explain:"During an active seizure, protect the patient from injury, do not restrain, do not insert objects in the mouth, and position to maintain airway patency. Airway management follows after the seizure stops.",points:1},
  {section:"Medical Emergencies I",type:"mc",stem:"A 55-year-old male presents with sudden onset of the worst headache of his life, stiff neck, and sensitivity to light. These findings are MOST consistent with:",options:["Tension headache from cervical strain","Hypertensive emergency","Subarachnoid hemorrhage or meningitis","Migraine with aura"],correct:[2],explain:"Sudden thunderclap headache described as worst of life, combined with nuchal rigidity and photophobia, is a classic presentation of subarachnoid hemorrhage or bacterial meningitis — both life-threatening emergencies.",points:1},
  {section:"Medical Emergencies I",type:"mc",stem:"The Cincinnati Stroke Scale assesses which THREE components?",options:["Pupil reactivity, speech, and grip strength","Facial droop, arm drift, and speech","Blood pressure, pulse rate, and level of consciousness","Vision changes, headache, and ataxia"],correct:[1],explain:"The Cincinnati Stroke Scale uses facial droop, arm drift, and speech. One abnormal finding suggests a 72% probability of stroke.",points:1},
  {section:"Medical Emergencies I",type:"mc",stem:"A patient with known epilepsy had a seizure 10 minutes ago and is now confused and drowsy. Vitals are stable. Which term BEST describes the patient's current state?",options:["Ictal phase","Preictal phase","Postictal phase","Status epilepticus"],correct:[2],explain:"The postictal phase follows a seizure and is characterized by confusion, drowsiness, and disorientation that can last minutes to hours. It is a normal recovery phase.",points:1},
  {section:"Medical Emergencies I",type:"mc",stem:"A 44-year-old female stung by a bee 10 minutes ago now has hives, wheezing, and severe anxiety. She has a prescribed epinephrine auto-injector. The CORRECT injection site is:",options:["The deltoid muscle of the upper arm","The anterolateral thigh","The posterior gluteal muscle","The abdomen"],correct:[1],explain:"Epinephrine auto-injectors are administered into the anterolateral thigh — the outer mid-thigh. This site provides rapid absorption and can be administered through clothing.",points:1},
  {section:"Medical Emergencies I",type:"best2",stem:"Which TWO findings are MOST consistent with a stroke rather than a hypoglycemic emergency?",options:["Blood glucose of 44 mg/dL","One-sided facial droop that persists after glucose administration","Confusion that resolves after oral glucose","Slurred speech with arm drift and blood glucose of 98 mg/dL"],correct:[1,3],explain:"Persistent neurological deficits (facial droop, arm drift, slurred speech) with a normal blood glucose point to stroke. Hypoglycemic symptoms typically resolve after glucose administration.",points:1},
  {section:"Medical Emergencies II",type:"mc",stem:"A patient presents with fever, stiff neck, altered mental status, and a petechial rash. These findings suggest:",options:["Viral upper respiratory infection","Bacterial meningitis","Febrile seizure","Hypertensive encephalopathy"],correct:[1],explain:"Fever, nuchal rigidity, altered mental status, and petechial or purpuric rash are classic findings of bacterial meningitis — a life-threatening emergency.",points:1},
  {section:"Medical Emergencies II",type:"mc",stem:"A patient found unconscious near empty prescription bottles has respirations of 6/min, shallow, with pinpoint equal pupils. These findings are MOST consistent with:",options:["Stimulant overdose","Opioid overdose","Alcohol intoxication","Benzodiazepine overdose"],correct:[1],explain:"Pinpoint pupils, respiratory depression, and decreased consciousness are the classic triad of opioid toxidrome. Immediate airway management and naloxone administration are indicated.",points:1},
  {section:"Medical Emergencies II",type:"mc",stem:"A COPD patient presents with acute dyspnea, RR of 24, and SpO2 of 86% on room air. What is the MOST appropriate oxygen approach?",options:["Withhold oxygen to preserve hypoxic drive","Apply non-rebreather mask at 15 LPM without reassessment","Titrate supplemental oxygen to achieve SpO2 of 94-98% and reassess frequently","Apply CPAP immediately without a trial of supplemental oxygen"],correct:[2],explain:"Current guidelines recommend titrating oxygen in COPD patients to target SpO2 of 94-98%, balancing the risk of hypoxia against theoretical hypoxic drive suppression.",points:1},
  {section:"Medical Emergencies II",type:"mc",stem:"Which presentation is MOST consistent with an acute asthma attack?",options:["Unilateral absent breath sounds with tracheal deviation","Bilateral expiratory wheezing with prolonged expiratory phase and accessory muscle use","Inspiratory stridor with fever and drooling","Diffuse crackles and frothy pink sputum"],correct:[1],explain:"Asthma causes bronchoconstriction producing bilateral expiratory wheezes with a prolonged expiratory phase. Accessory muscle use indicates significant respiratory distress.",points:1},
  {section:"Medical Emergencies II",type:"mc",stem:"A patient intentionally ingested drain cleaner (a strong alkali). The MOST appropriate prehospital management is:",options:["Induce vomiting to remove the substance","Administer activated charcoal immediately","Maintain airway, dilute with water if alert, and transport immediately","Neutralize with an acid solution orally"],correct:[2],explain:"Caustic ingestions should never be induced to vomit — this causes a second pass of the corrosive. Activated charcoal is not effective. Focus on airway management and rapid transport.",points:1},
  {section:"Medical Emergencies II",type:"best2",stem:"Which TWO interventions are MOST appropriate for a patient in a behavioral emergency who is becoming increasingly agitated?",options:["Restrain the patient immediately to prevent harm","Speak calmly and maintain a non-threatening posture","Maintain awareness of your exit and position yourself safely","Administer a sedative from your EMR kit"],correct:[1,2],explain:"De-escalation (calm voice, non-threatening posture) and scene safety awareness (exit awareness, safe positioning) are the cornerstones of behavioral emergency management for EMRs.",points:1},
  {section:"Trauma Assessment, Soft Tissue & Burns",type:"mc",stem:"Using the Rule of Nines, a patient has burns covering the entire right arm and the anterior chest. What is the estimated total BSA burned?",options:["18%","27%","22.5%","36%"],correct:[2],explain:"Right arm = 9%. Anterior chest = approximately 13.5% (anterior trunk is 18%; chest is roughly 13.5%). Total = 22.5%.",points:1},
  {section:"Trauma Assessment, Soft Tissue & Burns",type:"mc",stem:"A deep, moist, painful burn with blistering and a mottled red-and-white appearance is BEST classified as:",options:["Superficial (first-degree)","Partial thickness (second-degree)","Full thickness (third-degree)","Fourth-degree"],correct:[1],explain:"Partial thickness (second-degree) burns involve the epidermis and part of the dermis. They present with blisters, moist surface, intense pain, and mottled red-white appearance.",points:1},
  {section:"Trauma Assessment, Soft Tissue & Burns",type:"mc",stem:"A patient has an impaled object in the right cheek that is obstructing the airway. The CORRECT management is:",options:["Stabilize the object in place and transport","Remove the object, control bleeding, and manage the airway","Leave the object and position the patient to manage secretions","Pack the wound around the object and transport"],correct:[1],explain:"The general rule is to stabilize impaled objects. However, an object impaled in the cheek that obstructs the airway is a recognized exception — removal is indicated to manage the life threat.",points:1},
  {section:"Trauma Assessment, Soft Tissue & Burns",type:"mc",stem:"After sealing an open chest wound, the patient's condition worsens — breath sounds diminish on the affected side and tracheal deviation develops. You should:",options:["Apply a second occlusive dressing over the first","Burp or partially lift the dressing to relieve pressure","Remove the dressing entirely and apply a new one","Increase supplemental oxygen only"],correct:[1],explain:"Worsening after sealing a sucking chest wound suggests a tension pneumothorax. Temporarily lifting (burping) the dressing vents trapped air and can be life-saving.",points:1},
  {section:"Trauma Assessment, Soft Tissue & Burns",type:"mc",stem:"Which burn patient requires IMMEDIATE transport to a burn center?",options:["25-year-old with superficial burns to both hands from a brief flash","40-year-old with full-thickness circumferential burns to the right forearm","30-year-old with minor partial-thickness burns to the anterior forearm only","22-year-old with superficial burns to the back of the neck"],correct:[1],explain:"Circumferential full-thickness burns require burn center care due to the high risk of compartment syndrome from eschar constriction, which can compromise distal circulation.",points:1},
  {section:"Trauma Assessment, Soft Tissue & Burns",type:"best2",stem:"Which TWO mechanisms of injury should increase suspicion for serious internal injuries even if the patient appears stable?",options:["Fall from less than 6 feet with no loss of consciousness","High-speed MVC with airbag deployment and significant vehicle damage","Penetrating injury to the torso","Minor abrasion from a low-speed bicycle fall"],correct:[1,2],explain:"High-speed MVC and penetrating torso trauma are high-risk MOIs for serious internal injury regardless of initial vital signs. Kinematic energy and trajectory predict injury patterns.",points:1},
  {section:"Musculoskeletal, Spinal, Head & Chest Trauma",type:"mc",stem:"You are splinting a suspected tibial fracture. The CORRECT principle is to:",options:["Immobilize only the fracture site","Immobilize the joint above and below the fracture site","Straighten all angulated fractures before splinting","Apply the splint only if CSM is intact"],correct:[1],explain:"Proper splinting requires immobilizing the joint above and below the fracture. For a tibial fracture, the splint must extend from above the knee to below the ankle.",points:1},

const SECTION_COLORS = {
  "Medical Emergencies I":                       {bg:"#1a2f1a", accent:"#4CAF50"},
  "Medical Emergencies II":                      {bg:"#2a1a2a", accent:"#9C27B0"},
  "Trauma Assessment, Soft Tissue & Burns":      {bg:"#3d2000", accent:"#FF9800"},
  "Musculoskeletal, Spinal, Head & Chest Trauma":{bg:"#3d1515", accent:"#F44336"},
};

// ── STATE ────────────────────────────────────────────
// Pre-fill student name from portal URL param
const _urlParams = new URLSearchParams(window.location.search);
const _portalStudent = decodeURIComponent(_urlParams.get('student') || '').trim();

let phase        = "intro";
let studentName  = _portalStudent || "";
let current      = 0;
let answers      = Array(questions.length).fill(null);
let matchSels    = {};      // "qIdx-termIdx" -> def string
let shuffledDefs = {};      // qIdx -> shuffled def array
let timeLeft     = TOTAL_TIME;
let timerInterval= null;
let dragData     = null;    // {def, fromTermIdx}
let startTime    = null;

// ── SHUFFLE ──────────────────────────────────────────
function shuffle(arr) { return [...arr].sort(() => Math.random()-0.5); }
function initShuffles() {
  questions.forEach((q,i) => {
    if (q.type === "matching") shuffledDefs[i] = shuffle(q.pairs.map(p=>p.def));
  });
}

// ── SCORING ──────────────────────────────────────────
function scoreQuestion(q, ans) {
  if (ans === undefined || ans === null) return false;
  if (q.type === "mc")      { const ci = q.correct ? q.correct[0] : q.answer; return Array.isArray(ans) && String(ans[0]) === String(ci); }
  if (q.type === "best2")   return Array.isArray(ans) && ans.length===2 && ans.every(a=>q.correct.includes(a));
  if (q.type === "build") {
    const order = Array.isArray(ans) ? ans : [...Array(q.items.length).keys()];
    return order.length === q.order.length && order.every((v,j) => v === q.order[j]);
  }
  if (q.type === "matching") return Array.isArray(ans) && q.pairs.every((p,ti)=>ans[ti]===p.def);
  return false;
}
function calcScore() {
  let score=0, total=0;
  questions.forEach((q,i)=>{ total+=q.points; if(scoreQuestion(q,answers[i])) score+=q.points; });
  return {score,total};
}

// ── SAVE MATCHING ANS ────────────────────────────────
function saveMatchingAnswers(qIdx) {
  const q = questions[qIdx];
  answers[qIdx] = q.pairs.map((_,ti)=>matchSels[`${qIdx}-${ti}`]||null);
}

// ── TIMER ────────────────────────────────────────────
function startTimer() {
  startTime = Date.now();
  timerInterval = setInterval(()=>{
    timeLeft--;
    updateTimerUI();
    if (timeLeft <= 0) { clearInterval(timerInterval); finishExam(); }
  }, 1000);
}
function updateTimerUI() {
  const m = Math.floor(timeLeft/60), s = timeLeft%60;
  const str = `${m}:${String(s).padStart(2,"0")}`;
  const color = timeLeft<60?"#ef4444":timeLeft<180?"#b45309":"#22c55e";
  document.querySelectorAll(".timer-text").forEach(el=>{ el.textContent=str; el.style.color=color; });
  document.querySelectorAll(".timer-dot").forEach(el=>{ el.style.background=color; el.classList.toggle("pulse",timeLeft<60); });
  document.querySelectorAll(".timer-bar-fill").forEach(el=>{ el.style.width=`${(timeLeft/TOTAL_TIME)*100}%`; el.style.background=color; });
}

// ── SUBMIT TO GOOGLE SHEETS ──────────────────────────
// Uses GET with ?payload= because Apps Script cross-origin POST is blocked
// by CORS preflight. GET requests follow the redirect and reach doGet().
async function submitToFirebase(subData) {
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 15000);
  try {
    const url = `https://firestore.googleapis.com/v1/projects/${FB_CONFIG.projectId}/databases/(default)/documents/examResults`;
    const answersStr = JSON.stringify(subData.answersData, (k,v) => v === undefined ? null : v);
    const body = {
      fields: {
        examLabel:  {stringValue: subData.examLabel},
        category:   {stringValue: EXAM_CATEGORY},
        name:       {stringValue: subData.name},
        score:      {integerValue: String(isNaN(subData.score)   ? 0 : subData.score)},
        total:      {integerValue: String(isNaN(subData.total)   ? 0 : subData.total)},
        pct:        {integerValue: String(isNaN(subData.pct)     ? 0 : subData.pct)},
        timeUsed:   {integerValue: String(isNaN(subData.timeUsed)? 0 : subData.timeUsed)},
        submittedAt:{stringValue: subData.submittedAt},
        answersData:{stringValue: answersStr},
      }
    };
    const resp = await fetch(url + `?key=${FB_CONFIG.apiKey}`, {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(body),
      signal: controller.signal,
    });
    clearTimeout(timeout);
    if (!resp.ok) { const errText = await resp.text(); throw new Error(errText); }
    return { success: true };
  } catch(e) {
    clearTimeout(timeout);
    console.error("Firebase submit error:", e);
    return { success: false, error: e.toString() };
  }
}

// ── FINISH EXAM ──────────────────────────────────────
async function finishExam() {
  clearInterval(timerInterval);
  try {
    const {score,total} = calcScore();
    const pct = Math.round((score/total)*100);
    const timeUsed = TOTAL_TIME - timeLeft;
    const questionResults = questions.map((q,i) => {
      try { return scoreQuestion(q, answers[i]); } catch(e) { return false; }
    });

    const answersData = questions.map((q, i) => {
      const given = answers[i] !== undefined ? answers[i] : null;
      const correct = q.correct !== undefined ? q.correct
                    : q.order   !== undefined ? q.order
                    : q.pairs   !== undefined ? q.pairs.map(p => p.def)
                    : null;
      return { given, correct };
    });
    const subData = {
      examLabel: EXAM_LABEL,
      name: studentName,
      score, total, pct, timeUsed,
      answersData,
      submittedAt: new Date().toISOString(),
    };

    phase = "submitting";
    render();

    try {
      const result = await submitToFirebase(subData);
      window._submitResult = result;
    } catch(e) {
      console.error('submitToFirebase error:', e);
      window._submitResult = { success: false, error: e.toString() };
    }
    phase = "results";
    window._examScore = {score,total,pct};
    window._questionResults = questionResults;
    render();
  } catch(e) {
    console.error('finishExam fatal error:', e);
    // Force to results even if something went wrong
    phase = "results";
    window._examScore = window._examScore || {score:0,total:questions.length,pct:0};
    window._questionResults = window._questionResults || questions.map(()=>false);
    window._submitResult = { success: false, error: 'Exam error: ' + e.toString() };
    render();
  }
}

// ── RENDER ───────────────────────────────────────────
function render() {
  const root = document.getElementById("root");
  if (phase === "intro")       root.innerHTML = renderIntro();
  else if (phase === "submitting") root.innerHTML = renderSubmitting();
  else if (phase === "results") root.innerHTML = renderResults();
  else                          root.innerHTML = renderExam();
  attachEvents();
}

    statusHtml = sr.success

  }

  const reviewRows = questions.map((q,i)=>{

    let correctAns = "";

function renderExam() {
  const q = questions[current];
  const sc = SECTION_COLORS[q.section] || {bg:"#1a1a2e",accent:"#b91c1c"};
  const progress = ((current+1)/questions.length)*100;
  const ans = answers[current] || [];

  let questionBody = "";
  if (q.type==="mc" || q.type==="best2") {
    const hint = q.type==="best2"
      ? `<div class="best2-hint">★ Select the TWO best answers ${ans.length>0?"("+ans.length+"/2 selected)":""}</div>` : "";
    const opts = q.options.map((opt,idx)=>{
      const sel = ans.includes(idx);
      return `<button class="option-btn ${q.type==="best2"?"best2":""} ${sel?"selected":""}" data-idx="${idx}">
        <div class="option-indicator">${LETTERS[idx]}</div>
        <div class="option-text">${opt}</div>
      </button>`;
    }).join("");
    questionBody = `<div class="options-list">${hint}${opts}</div>`;

  } else if (q.type==="matching") {
    const defs = shuffledDefs[current] || q.pairs.map(p=>p.def);
    const usedDefs = new Set(Object.entries(matchSels).filter(([k])=>k.startsWith(current+"-")).map(([,v])=>v));
    const bankDefs = defs.filter(d=>!usedDefs.has(d));

    const bankChips = bankDefs.map(def=>`<div class="def-chip" draggable="true" data-def="${encodeURIComponent(def)}">${def}</div>`).join("") ||
      `<div class="def-bank-empty">All definitions assigned</div>`;

    const termRows = q.pairs.map((pair,ti)=>{
      const assigned = matchSels[`${current}-${ti}`];
      return `
        <div class="term-row ${assigned?"assigned":""}" data-term-idx="${ti}">
          <div class="term-name"><span>${pair.term}</span></div>
          <div class="term-drop">
            ${assigned
              ? `<div class="def-chip" draggable="true" data-def="${encodeURIComponent(assigned)}" data-from-term="${ti}" style="margin:0;width:100%">${assigned}</div>`
              : `<span class="term-placeholder">— drag a definition here —</span>`}
          </div>
        </div>`;
    }).join("");

    questionBody = `
      <div class="match-instructions"><strong>Drag</strong> a definition from the bank and <strong>drop</strong> it onto the matching term. Drag a placed definition back to the bank to unassign it.</div>
      <div class="bank-label">Definition Bank</div>
      <div class="def-bank" id="defBank">${bankChips}</div>
      <div class="terms-label">Terms — Drop definitions here</div>
      <div class="term-rows">${termRows}</div>`;

  } else if (q.type==="build") {
    const order = Array.isArray(answers[current]) ? answers[current] : [...Array(q.items.length).keys()];
    const items = order.map(origIdx => ({origIdx, text: q.items[origIdx]}));
    const buildItems = items.map((item, pos) => {
      return '<div class="build-item" draggable="true" data-orig-idx="' + item.origIdx + '" data-pos="' + pos + '">'
        + '<div class="build-handle">&#8942;</div>'
        + '<div class="build-num">' + (pos+1) + '</div>'
        + '<div class="build-text">' + item.text + '</div>'
        + '</div>';
    }).join('');
    questionBody = '<div class="build-instructions">Drag the steps into the correct order — first step at the top.</div>'
      + '<div class="build-list" id="buildList">' + buildItems + '</div>';
  }
  const typeBadge = q.type==="build"
    ? `<span class="q-badge q-badge-build">ORDER STEPS</span>`
    : q.type==="best2"
    ? `<span class="q-badge" style="background:#7c3aed22;color:#a78bfa;border:1px solid #7c3aed44">SELECT 2</span>` : "";

  const dots = questions.map((_,i)=>
    `<div class="dot ${i===current?"current":answers[i]?"answered":""}" style="width:${i===current?20:10}px" data-dot="${i}"></div>`
  ).join("");

  const navRight = current < questions.length-1
    ? `<button class="btn-next" id="nextBtn">Next →</button>`
    : `<button class="btn-submit-exam" id="submitExamBtn">Submit Exam</button>`;

  return `
    <div>
      <div class="topbar">
        <div class="topbar-inner">
          <div class="progress-wrap">
            <div class="progress-bar"><div class="progress-fill" style="width:${progress}%;background:${sc.accent}"></div></div>
            <span class="progress-text">${current+1} / ${questions.length}</span>
          </div>
          <div class="timer-box" style="border-color:#1e2a3a">
            <div class="timer-dot" style="background:#22c55e"></div>
            <span class="timer-text" style="color:#22c55e">25:00</span>
          </div>
          <button class="btn-submit-top" id="submitTopBtn" style="background:${sc.accent}">Submit</button>
        </div>
        <div class="timer-bar"><div class="timer-bar-fill" style="width:100%;background:#22c55e"></div></div>
      </div>

      <div class="exam-wrap">
        <div class="section-badge" style="background:${sc.bg}">
          <div class="section-dot" style="background:${sc.accent}"></div>
          <span class="section-label" style="color:${sc.accent}">${q.section}</span>
        </div>

        <div class="q-header">
          <span class="q-label">QUESTION</span>
          <span class="q-number">${current+1}</span>
          ${typeBadge}
          <span class="q-points">${q.points} pt</span>
        </div>

        <div class="q-stem">${q.stem}</div>
        ${questionBody}

        <div class="nav-bar">
          <button class="btn-prev" id="prevBtn" ${current===0?"disabled":""}>← Previous</button>
          <div class="dots">${dots}</div>
          ${navRight}
        </div>
      </div>
    </div>`;
}

// ── EVENT BINDING ────────────────────────────────────
function attachEvents() {
  // INTRO
  const nameInput = document.getElementById("nameInput");
  const beginBtn  = document.getElementById("beginBtn");
  if (nameInput) {
    nameInput.value = studentName;
    nameInput.addEventListener("input", e=>{
      studentName = e.target.value.trim();
      nameInput.classList.toggle("has-value", !!studentName);
      beginBtn.disabled = !studentName;
      beginBtn.classList.toggle("active", !!studentName);
    });
    nameInput.addEventListener("keydown", e=>{ if(e.key==="Enter"&&studentName) beginExam(); });
  }
  if (beginBtn) {
    beginBtn.classList.toggle("active", !!studentName);
    beginBtn.addEventListener("click", ()=>{ if(studentName) beginExam(); });
  }

  // EXAM — MC / Best2
  document.querySelectorAll(".option-btn").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      const idx = parseInt(btn.dataset.idx);
      const q = questions[current];
      if (q.type==="mc") {
        answers[current] = [idx];
      } else {
        const prev = answers[current] || [];
        if (prev.includes(idx)) answers[current] = prev.filter(i=>i!==idx);
        else if (prev.length<2) answers[current] = [...prev,idx];
        else answers[current] = [prev[1],idx];
      }
      render();
    });
  });

  // EXAM — Matching drag & drop
  let draggingEl = null;
  document.querySelectorAll(".def-chip").forEach(chip=>{
    chip.addEventListener("dragstart", e=>{
      draggingEl = chip;
      chip.classList.add("dragging");
      const def = decodeURIComponent(chip.dataset.def);
      const fromTerm = chip.dataset.fromTerm !== undefined ? parseInt(chip.dataset.fromTerm) : null;
      dragData = {def, fromTermIdx: fromTerm};
      e.dataTransfer.effectAllowed = "move";
    });
    chip.addEventListener("dragend", ()=>{ chip.classList.remove("dragging"); draggingEl = null; });
  });

  // Drop on term rows
  document.querySelectorAll(".term-row").forEach(row=>{
    row.addEventListener("dragover", e=>{ e.preventDefault(); row.classList.add("dragover"); });
    row.addEventListener("dragleave", ()=>row.classList.remove("dragover"));
    row.addEventListener("drop", e=>{
      e.preventDefault(); row.classList.remove("dragover");
      if (!dragData) return;
      const termIdx = parseInt(row.dataset.termIdx);
      const {def, fromTermIdx} = dragData; dragData = null;
      // Remove from old slot
      if (fromTermIdx !== null && fromTermIdx !== undefined) delete matchSels[`${current}-${fromTermIdx}`];
      // Remove any slot that had this def
      Object.keys(matchSels).forEach(k=>{ if(matchSels[k]===def) delete matchSels[k]; });
      matchSels[`${current}-${termIdx}`] = def;
      saveMatchingAnswers(current);
      render();
    });
  });

  // Build question drag-and-drop reordering
  const buildList = document.getElementById('buildList');
  if (buildList) {
    let dragSrcPos = null;
    buildList.querySelectorAll('.build-item').forEach(item => {
      item.addEventListener('dragstart', e => {
        dragSrcPos = parseInt(item.dataset.pos);
        item.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
      });
      item.addEventListener('dragend', () => item.classList.remove('dragging'));
      item.addEventListener('dragover', e => { e.preventDefault(); item.classList.add('dragover'); });
      item.addEventListener('dragleave', () => item.classList.remove('dragover'));
      item.addEventListener('drop', e => {
        e.preventDefault();
        item.classList.remove('dragover');
        const dropPos = parseInt(item.dataset.pos);
        if (dragSrcPos === null || dragSrcPos === dropPos) return;
        // Get current order array
        const order = Array.isArray(answers[current])
          ? [...answers[current]]
          : [...Array(questions[current].items.length).keys()];
        // Swap
        const tmp = order[dragSrcPos];
        order[dragSrcPos] = order[dropPos];
        order[dropPos] = tmp;
        answers[current] = order;
        dragSrcPos = null;
        render();
      });
    });
  }

    // Drop on bank (return)
  const bank = document.getElementById("defBank");
  if (bank) {
    bank.addEventListener("dragover", e=>{ e.preventDefault(); bank.classList.add("dragover"); });
    bank.addEventListener("dragleave", ()=>bank.classList.remove("dragover"));
    bank.addEventListener("drop", e=>{
      e.preventDefault(); bank.classList.remove("dragover");
      if (!dragData) return;
      const {fromTermIdx} = dragData; dragData = null;
      if (fromTermIdx !== null && fromTermIdx !== undefined) {
        delete matchSels[`${current}-${fromTermIdx}`];
        saveMatchingAnswers(current);
        render();
      }
    });
  }

  // NAV
  const prevBtn = document.getElementById("prevBtn");
  const nextBtn = document.getElementById("nextBtn");
  const submitExamBtn = document.getElementById("submitExamBtn");
  const submitTopBtn  = document.getElementById("submitTopBtn");

  if (prevBtn) prevBtn.addEventListener("click", ()=>{ if(current>0){ current--; render(); }});
  if (nextBtn) nextBtn.addEventListener("click", ()=>{ if(current<questions.length-1){ current++; render(); }});
  if (submitExamBtn) submitExamBtn.addEventListener("click", finishExam);
  if (submitTopBtn)  submitTopBtn.addEventListener("click",  finishExam);

  // Dot nav
  document.querySelectorAll(".dot").forEach(dot=>{
    dot.addEventListener("click", ()=>{ current=parseInt(dot.dataset.dot); render(); });
  });

  // Update timer display immediately
  updateTimerUI();
}

function beginExam() {
  initShuffles();
  phase = "exam";
  render();
  startTimer();
}

// ── BOOT ─────────────────────────────────────────────
document.addEventListener("DOMContentLoaded", ()=>{
  document.getElementById("root").innerHTML = "";
  render();
});
</script>

<div id="root"></div>
</body>
</html>
