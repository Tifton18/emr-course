<title>Class Attendance & Grades Tracker</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #f0f6ff; color: #1e3a5f; font-family: 'Georgia','Times New Roman',serif; min-height: 100vh; }
 
#syncBar { position:fixed;top:0;left:0;right:0;height:3px;z-index:999;background:transparent;transition:background 0.4s; }
#syncBar.syncing { background:linear-gradient(90deg,#2563eb,#3b82f6,#2563eb);background-size:200%;animation:shimmer 1s infinite; }
#syncBar.saved { background:#4ade80;animation:fadeBar 1.5s forwards; }
#syncBar.error { background:#f87171; }
@keyframes shimmer{0%{background-position:0%}100%{background-position:200%}}
@keyframes fadeBar{0%{opacity:1}70%{opacity:1}100%{opacity:0}}
#syncLabel { position:fixed;top:10px;right:16px;font-size:11px;letter-spacing:1px;color:#6b82a0;z-index:1000;text-transform:uppercase;transition:color 0.3s; }
#syncLabel.syncing{color:#3b82f6} #syncLabel.saved{color:#4ade80} #syncLabel.error{color:#f87171}
 
.header { border-bottom:1px solid #bfdbfe;padding:32px 32px 0;background:linear-gradient(180deg,#e6f0fb 0%,#f0f6ff 100%);margin-top:3px; }
.header-top { display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:12px; }
.header-label { font-size:11px;letter-spacing:3px;color:#6b82a0;text-transform:uppercase;margin-bottom:6px; }
#classNameDisplay { font-size:28px;font-weight:normal;cursor:pointer;letter-spacing:-0.5px;background:none;border:none;color:#1e3a5f;font-family:'Georgia',serif;display:inline-block; }
#classNameInput { font-size:28px;font-family:'Georgia',serif;background:transparent;border:none;border-bottom:2px solid #2563eb;color:#1e3a5f;outline:none;width:300px;display:none; }
.today-count { text-align:right;font-size:13px;color:#6b82a0; }
.today-count .big { font-size:22px;color:#1e3a5f; }
.tabs { display:flex; }
.tab-btn { background:none;border:none;padding:10px 20px;color:#6b82a0;border-bottom:2px solid transparent;cursor:pointer;font-size:13px;letter-spacing:1px;text-transform:uppercase;transition:color 0.2s;font-family:'Georgia',serif; }
.tab-btn.active { color:#3b82f6;border-bottom-color:#2563eb; }
 
.content { padding:28px 32px; }
.tab-panel { display:none; }
.tab-panel.active { display:block; }
 
.date-row { display:flex;align-items:center;gap:16px;margin-bottom:24px;flex-wrap:wrap; }
#datePicker { background:#f8faff;border:1px solid #bfdbfe;border-radius:8px;color:#1e3a5f;padding:10px 14px;font-size:14px;cursor:pointer;font-family:'Georgia',serif;outline:none; }
.date-label { color:#6b82a0;font-size:13px; }
.mark-all-row { margin-left:auto;display:flex;gap:8px;flex-wrap:wrap; }
.mark-all-btn { padding:6px 12px;border-radius:6px;cursor:pointer;font-size:11px;letter-spacing:1px;text-transform:uppercase;transition:opacity 0.2s; }
.mark-all-btn:hover { opacity:0.8; }
 
.student-list { display:flex;flex-direction:column;gap:8px; }
.student-row { display:flex;align-items:center;gap:16px;background:#f0f6ff;border:1px solid #bfdbfe;border-radius:10px;padding:14px 18px;border-left:3px solid #dbeafe;transition:border-color 0.2s; }
.student-num { width:28px;text-align:center;color:#93adc8;font-size:12px; }
.student-name { flex:1;font-size:15px; }
.status-btns { display:flex;gap:6px; }
.status-btn { width:36px;height:36px;border-radius:8px;border:1px solid #bfdbfe;background:transparent;color:#93adc8;cursor:pointer;font-size:12px;font-weight:bold;transition:all 0.15s; }
.remove-btn { background:none;border:none;color:#bfdbfe;cursor:pointer;font-size:20px;padding:0 4px;transition:color 0.2s;line-height:1; }
.remove-btn:hover { color:#f87171; }
 
.add-row { margin-top:16px; }
.add-form { display:flex;gap:10px; }
#newStudentInput { flex:1;background:#f8faff;border:1px solid #2563eb;border-radius:8px;color:#1e3a5f;padding:12px 16px;font-size:14px;outline:none;font-family:'Georgia',serif; }
.btn-primary { background:#2563eb;border:none;border-radius:8px;color:#fff;padding:12px 20px;cursor:pointer;font-size:14px;font-family:'Georgia',serif; }
.btn-secondary { background:#dbeafe;border:1px solid #bfdbfe;border-radius:8px;color:#6b82a0;padding:12px 16px;cursor:pointer;font-size:14px;font-family:'Georgia',serif; }
#addStudentTrigger { background:none;border:1px dashed #93c5fd;border-radius:10px;color:#93adc8;padding:14px 18px;cursor:pointer;font-size:13px;width:100%;transition:all 0.2s;font-family:'Georgia',serif; }
#addStudentTrigger:hover { border-color:#2563eb;color:#3b82f6; }
 
.grades-layout { display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap; }
.assignments-panel { flex:0 0 310px;min-width:260px; }
.grades-grid-panel { flex:1;min-width:300px; }
.panel-title { font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#6b82a0;margin-bottom:14px; }
 
.weights-info { background:#f0f6ff;border:1px solid #bfdbfe;border-radius:10px;padding:14px;margin-bottom:20px; }
.weights-title { font-size:11px;letter-spacing:1px;text-transform:uppercase;color:#6b82a0;margin-bottom:10px; }
.weights-row { display:flex;justify-content:space-between;align-items:center;padding:3px 0; }
.weights-label { font-size:12px; }
.weights-val { font-size:12px;color:#6b82a0; }
 
.category-block { margin-bottom:18px; }
.category-header { display:flex;align-items:center;justify-content:space-between;margin-bottom:8px; }
.category-label { display:flex;align-items:center;gap:8px;font-size:13px; }
.cat-dot { width:8px;height:8px;border-radius:50%;flex-shrink:0; }
.weight-badge { font-size:11px;color:#4a6080;background:#f0f6ff;border:1px solid #93c5fd;border-radius:20px;padding:2px 8px; }
.add-assign-btn { background:none;border:1px solid #bfdbfe;border-radius:6px;color:#6b82a0;padding:4px 10px;cursor:pointer;font-size:11px;font-family:'Georgia',serif;transition:all 0.2s; }
.add-assign-btn:hover { border-color:#2563eb;color:#3b82f6; }
 
.assignment-item { display:flex;align-items:center;gap:8px;background:#f8fbff;border:1px solid #bfdbfe;border-radius:8px;padding:8px 12px;margin-bottom:5px; }
.assign-name { flex:1;font-size:13px;color:#334d6e; }
.assign-points { font-size:11px;color:#6b82a0;white-space:nowrap; }
.remove-assign-btn { background:none;border:none;color:#bfdbfe;cursor:pointer;font-size:16px;line-height:1;transition:color 0.2s;padding:0 2px;flex-shrink:0; }
.remove-assign-btn:hover { color:#f87171; }
 
.add-assign-form { display:flex;gap:6px;margin-top:6px;flex-wrap:wrap; }
.assign-name-input { flex:1;min-width:80px;background:#f8faff;border:1px solid #2563eb;border-radius:6px;color:#1e3a5f;padding:7px 10px;font-size:13px;outline:none;font-family:'Georgia',serif; }
.assign-pts-input { width:56px;background:#f8faff;border:1px solid #bfdbfe;border-radius:6px;color:#1e3a5f;padding:7px 8px;font-size:13px;outline:none;font-family:'Georgia',serif;text-align:center; }
.btn-tiny { background:#2563eb;border:none;border-radius:6px;color:#fff;padding:7px 12px;cursor:pointer;font-size:12px;font-family:'Georgia',serif; }
.btn-tiny-sec { background:#dbeafe;border:1px solid #bfdbfe;border-radius:6px;color:#6b82a0;padding:7px 10px;cursor:pointer;font-size:12px;font-family:'Georgia',serif; }
.no-assigns-msg { font-size:12px;color:#93adc8;padding:2px 0 8px 16px; }
 
.grades-table-wrap { overflow-x:auto; }
table.grades-table { width:100%;border-collapse:collapse;font-size:13px; }
.grades-table th { background:#e6f0fb;color:#4a6080;font-size:10px;letter-spacing:1px;text-transform:uppercase;padding:10px 12px;text-align:left;border-bottom:1px solid #dbeafe;white-space:nowrap;font-weight:normal; }
.grades-table th.center,.grades-table td.center { text-align:center; }
.grades-table tr.sgrow { border-bottom:1px solid #ffffff; }
.grades-table tr.sgrow:hover td { background:#ffffff44; }
.grades-table td { padding:10px 12px;vertical-align:middle; }
.td-name { font-size:14px; }
.pts-input-wrap { display:flex;align-items:center;justify-content:center;gap:3px; }
.pts-scored { width:40px;background:#f8faff;border:1px solid #bfdbfe;border-radius:5px;color:#1e3a5f;padding:5px 4px;font-size:12px;text-align:center;outline:none;font-family:'Georgia',serif;transition:border-color 0.2s; }
.pts-scored:focus { border-color:#2563eb; }

let examResults={};
// ── EXAM OVERRIDES ────────────────────────────────────────────────────────────
// examOverrides: { [examLabel]: { [questionIndex]: 'exclude' | 'fullcredit' } }
let examOverrides = {};
function loadExamOverrides() {
  examOverrides = JSON.parse(JSON.stringify(data.examOverrides || {}));
}
function saveExamOverrides() {
  data.examOverrides = JSON.parse(JSON.stringify(examOverrides));
  scheduleSave();
}
function setQuestionOverride(examLabel, questionIndex, mode) {
  if (!examOverrides[examLabel]) examOverrides[examLabel] = {};
  if (examOverrides[examLabel][questionIndex] === mode) {
    delete examOverrides[examLabel][questionIndex];
  } else {
    examOverrides[examLabel][questionIndex] = mode;
  }
  if (Object.keys(examOverrides[examLabel]).length === 0) delete examOverrides[examLabel];
  saveExamOverrides();
  renderAnalysis();
  if (typeof renderGradesGrid === 'function') renderGradesGrid();
}
function getExamScoreWithOverrides(studentName, assignId) {
  const raw = getExamScore(studentName, assignId);
  if (!raw) return raw;
  const def = Object.values(EXAM_DEFS).flat().find(d => d.assignId === assignId);
  if (!def) return raw;
  const overrideMap = examOverrides[def.label];
  if (!overrideMap || Object.keys(overrideMap).length === 0) return raw;
  const studentKey = studentName.trim().toLowerCase();
  const studentExams = examResults[studentKey] || {};
  const r = studentExams[assignId];
  if (!r || !r.answersData) return raw;
  const answers = r.answersData;
  let adjustedScore = 0;
  let adjustedTotal = 0;
  answers.forEach((entry, idx) => {
    const override = overrideMap[idx];
    const pts = 1;
    if (override === 'exclude') return;
    adjustedTotal += pts;
    if (override === 'fullcredit') {
      adjustedScore += pts;
    } else {
      if (entry.given !== null && entry.given !== undefined && entry.correct !== null && entry.correct !== undefined) {
        const g = Array.isArray(entry.given) ? entry.given : [entry.given];
        const c = Array.isArray(entry.correct) ? entry.correct : [entry.correct];
        const gs = new Set(g.map(String)), cs = new Set(c.map(String));
        if (gs.size === cs.size && [...cs].every(x => gs.has(x))) adjustedScore += pts;
      }
    }
  });
  if (adjustedTotal === 0) return { pct: 100, score: 0, total: 0, _adjusted: true };
  return { pct: Math.round((adjustedScore / adjustedTotal) * 100), score: adjustedScore, total: adjustedTotal, _adjusted: true, _rawPct: raw.pct };
}

async function attemptInstructorLogin() {
  const email = document.getElementById('loginEmail').value.trim();
  const pw    = document.getElementById('loginPw').value;
  const err   = document.getElementById('loginError');
  const btn   = document.getElementById('loginBtn');
  err.style.display = 'none';
  btn.textContent = 'Signing in…';
  btn.disabled = true;
  try {
    await auth.signInWithEmailAndPassword(email, pw);
  } catch(e) {
    err.textContent = e.code === 'auth/wrong-password' || e.code === 'auth/user-not-found'
      ? 'Incorrect email or password.'
      : e.message;
    err.style.display = 'block';
    btn.textContent = 'Sign In';
    btn.disabled = false;
  }
}

function sendPasswordReset() {
  const email = document.getElementById('loginEmail').value.trim();
  if (!email) { alert('Enter your email address first.'); return; }
  auth.sendPasswordResetEmail(email)
    .then(() => alert('Password reset email sent to ' + email))
    .catch(e => alert('Error: ' + e.message));
}

// Watch auth state — show/hide tracker based on login status
auth.onAuthStateChanged(user => {
  if (user) {
    try { sessionStorage.setItem('tfd_instructor', '1'); } catch(e) {}
    document.getElementById('loginOverlay').classList.remove('visible');
    document.getElementById('instructorBar').classList.remove('hidden');
    const nameEl = document.querySelector('.instructor-bar-name');
    if (nameEl) nameEl.textContent = '👨‍🏫 ' + (user.displayName || user.email);

  } else {
    try { sessionStorage.removeItem('tfd_instructor'); } catch(e) {}
    document.getElementById('loginOverlay').classList.add('visible');
    document.getElementById('instructorBar').classList.add('hidden');
  }
});

function instructorSignOut() {

    document.getElementById('instructorBar').classList.add('hidden');
  });
}

      _instructorEmails = arr.map(v => (v.stringValue||'').toLowerCase().trim()).filter(Boolean);

async function addInstructorEmail() {
  const input = document.getElementById('newInstructorEmail');
  const status = document.getElementById('instructorEmailStatus');
  const email = input.value.trim().toLowerCase();
  if (!email || !email.includes('@')) { status.textContent = 'Please enter a valid email address.'; status.style.color = '#dc2626'; return; }
  if (_instructorEmails.includes(email)) { status.textContent = 'That email is already on the list.'; status.style.color = '#f97316'; return; }
  _instructorEmails.push(email);
  renderInstructorEmailList();
  const ok = await saveInstructorEmails();
  status.textContent = ok ? `✓ ${email} added successfully.` : '✗ Failed to save. Check your connection.';
  status.style.color = ok ? '#16a34a' : '#dc2626';
  if (ok) input.value = '';
  setTimeout(() => { status.textContent = ''; }, 3000);
}

async function removeInstructorEmail(email) {
  if (!confirm(`Remove ${email} from instructor access?`)) return;
  _instructorEmails = _instructorEmails.filter(e => e !== email);
  renderInstructorEmailList();
  const ok = await saveInstructorEmails();
  const status = document.getElementById('instructorEmailStatus');
  status.textContent = ok ? `✓ ${email} removed.` : '✗ Failed to save.';
  status.style.color = ok ? '#16a34a' : '#dc2626';
  setTimeout(() => { status.textContent = ''; }, 3000);
}

const ARCHIVE_COL = 'archives';

async function loadArchives() {
  try {
    const url = `https://firestore.googleapis.com/v1/projects/${FB_CONFIG.projectId}/databases/(default)/documents/${ARCHIVE_COL}?key=${FB_CONFIG.apiKey}&pageSize=50`;
    const resp = await fetch(url);
    if (!resp.ok) return [];
    const doc = await resp.json();
    if (!doc.documents) return [];
    return doc.documents.map(d => {
      const f = d.fields || {};
      return {
        id: d.name.split('/').pop(),
        docName: d.name,
        className:    f.className?.stringValue    || 'Unnamed Class',
        archivedAt:   f.archivedAt?.stringValue   || '',
        studentCount: parseInt(f.studentCount?.integerValue || 0),
        dayCount:     parseInt(f.dayCount?.integerValue     || 0),
        avgPct:       parseInt(f.avgPct?.integerValue       || 0),
        passCount:    parseInt(f.passCount?.integerValue    || 0),
        students:     JSON.parse(f.students?.stringValue    || '[]'),
        attendance:   JSON.parse(f.attendance?.stringValue  || '{}'),
        scores:       JSON.parse(f.scores?.stringValue      || '{}'),
        assignments:  JSON.parse(f.assignments?.stringValue || '[]'),
        examResults:  JSON.parse(f.examResults?.stringValue || '{}'),
        certificates: JSON.parse(f.certificates?.stringValue || '{}'),
      };
    }).sort((a,b) => b.archivedAt.localeCompare(a.archivedAt));
  } catch(e) { console.error('loadArchives:', e); return []; }
}

// ── Archive creation flow ─────────────────────────────────────────────────────
async function beginArchiveFlow() {
  const className = data.className || 'My Class';
  const name = prompt(`Archive name (edit or press OK):\n`, className + ' — ' + new Date().getFullYear());
  if (!name) return;

  setSyncStatus('syncing', 'Creating archive…');

  const examDefs = Object.values(EXAM_DEFS).flat();
  const studentCount = (data.students || []).length;
  const dayCount = Object.keys(data.attendance || {}).length;

  // Compute per-student overall (all graded exam categories)
  let totalPct = 0, countWithScores = 0, passCount = 0;
  (data.students || []).forEach(s => {
    const sKey = s.name.toLowerCase().trim();
    const sExams = (examResults[sKey] || {});
    let earned = 0, possible = 0;
    examDefs.forEach(d => {
      if (['module','midterm','final'].includes(d.category)) {
        const r = sExams[d.assignId];
        if (r) { earned += r.pct; possible += 100; }
      }
    });
    if (possible > 0) {
      const overall = Math.round(earned / possible * 100);
      totalPct += overall; countWithScores++;
      if (overall >= 70) passCount++;
    }
  });
  const avgPct = countWithScores > 0 ? Math.round(totalPct / countWithScores) : 0;

  // Snapshot ALL exam results — with override-adjusted scores baked in
  const overridesSnapshot = JSON.parse(JSON.stringify(examOverrides));
  const examSnapshot = {};
  (data.students || []).forEach(s => {
    const key = s.name.toLowerCase().trim();
    if (examResults[key]) examSnapshot[key] = examResults[key];
  });

  // Fetch certificates for all students
  let certSnapshot = {};
  try {
    const certUrl = `https://firestore.googleapis.com/v1/projects/${FB_CONFIG.projectId}/databases/(default)/documents:runQuery?key=${FB_CONFIG.apiKey}`;
    const certBody = { structuredQuery: { from: [{ collectionId: 'certificates' }] } };
    const certResp = await fetch(certUrl, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(certBody) });
    if (certResp.ok) {
      const certRows = await certResp.json();
      for (const row of certRows) {
        if (!row.document) continue;
        const f = row.document.fields || {};
        const sName = f.studentName?.stringValue || '';
        if (!sName) continue;
        if (!certSnapshot[sName]) certSnapshot[sName] = [];
        certSnapshot[sName].push({
          certName:    f.certName?.stringValue || '',
          downloadUrl: f.downloadUrl?.stringValue || '',
          fileType:    f.fileType?.stringValue || '',
          uploadedAt:  f.uploadedAt?.stringValue || '',
        });
      }
    }
  } catch(e) { console.error('Cert fetch for archive:', e); }

  const body = {
    fields: {
      className:    { stringValue: name },
      archivedAt:   { stringValue: new Date().toISOString() },
      studentCount: { integerValue: String(studentCount) },
      dayCount:     { integerValue: String(dayCount) },
      avgPct:       { integerValue: String(avgPct) },
      passCount:    { integerValue: String(passCount) },
      students:     { stringValue: JSON.stringify(data.students || []) },
      attendance:   { stringValue: JSON.stringify(data.attendance || {}) },
      scores:       { stringValue: JSON.stringify(data.scores || {}) },
      assignments:  { stringValue: JSON.stringify(data.assignments || []) },
      examResults:  { stringValue: JSON.stringify(examSnapshot) },
      certificates: { stringValue: JSON.stringify(certSnapshot) },
      examOverrides: { stringValue: JSON.stringify(overridesSnapshot) },
    }
  };

  try {
    const resp = await fetch(
      `https://firestore.googleapis.com/v1/projects/${FB_CONFIG.projectId}/databases/(default)/documents/${ARCHIVE_COL}?key=${FB_CONFIG.apiKey}`,
      { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) }
    );
    if (!resp.ok) throw new Error(await resp.text());
    setSyncStatus('saved', '✓ Archive saved');
    setTimeout(()=>setSyncStatus('',''), 2000);

    const doReset = confirm('Ready to reset for the new class?\n\nThis will clear: students, attendance, grades, and exam submissions.\nPortal content and course structure will be kept.');
    if (doReset) await performReset();

    renderArchives();
  } catch(e) {
    setSyncStatus('error', '✗ Archive failed');
    console.error('Archive error:', e);
    alert('Archive failed: ' + e.message);
  }
}

async function performReset() {
  setSyncStatus('syncing', 'Resetting…');
  data.students = [];
  data.attendance = {};
  data.assignments = [];
  data.scores = {};
  try { await DOC_REF.set(JSON.parse(JSON.stringify(data))); } catch(e) {}

  // Delete all exam submissions from Firestore
  try {
    const url = `https://firestore.googleapis.com/v1/projects/${FB_CONFIG.projectId}/databases/(default)/documents/examResults?key=${FB_CONFIG.apiKey}&pageSize=200`;
    const resp = await fetch(url);
    if (resp.ok) {
      const docs = (await resp.json()).documents || [];
      for (const doc of docs) {
        await fetch(`https://firestore.googleapis.com/v1/${doc.name}?key=${FB_CONFIG.apiKey}`, {method:'DELETE'});
      }
    }
  } catch(e) { console.error('Reset exam delete error:', e); }

  examResults = {};
  setSyncStatus('saved', '✓ Reset complete — ready for new class');
  setTimeout(()=>setSyncStatus('',''), 3000);
  renderAttendance();
}

async function downloadArchiveHTML(id) {
  const archives = await loadArchives();
  const a = archives.find(x => x.id === id);
  if (!a) return;

  const examDefs = Object.values(EXAM_DEFS).flat();
  const date = a.archivedAt ? new Date(a.archivedAt).toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'}) : '—';

  // Build per-student rows
  const studentRows = (a.students || []).map(s => {
    const sKey = s.name.toLowerCase().trim();
    const sExams = (a.examResults || {})[sKey] || {};
    let earned = 0, possible = 0;
    examDefs.forEach(d => {
      if (['module','midterm','final'].includes(d.category)) {
        const r = sExams[d.assignId];
        if (r) { earned += r.pct; possible += 100; }
      }
    });
    const overall = possible > 0 ? Math.round(earned / possible * 100) : null;
    const certs = (a.certificates || {})[s.name] || [];
    // Attendance
    const days = Object.keys(a.attendance || {}).sort();
    let present=0, absent=0, late=0;
    days.forEach(d => {
      const st = (a.attendance[d]||{})[s.id]||'';
      if (st==='P') present++;
      else if (st==='A') absent++;
      else if (st==='L'||st==='T') late++;
    });
    return { ...s, exams: sExams, overall, certs, present, absent, late, totalDays: days.length };
  });

  const passCount = studentRows.filter(s => s.overall !== null && s.overall >= 70).length;
  const avgOverall = studentRows.filter(s=>s.overall!==null).length > 0
    ? Math.round(studentRows.filter(s=>s.overall!==null).reduce((sum,r)=>sum+r.overall,0)/studentRows.filter(s=>s.overall!==null).length) : 0;

  // Graded exam columns
  const gradedCols = examDefs.filter(d => ['module','midterm','final'].includes(d.category));

  // Build student sections
  const studentSections = studentRows.map(s => {
    const examRowsHtml = examDefs.map(d => {
      const r = s.exams[d.assignId];
      if (!r) return '';
      const dt = r.submittedAt ? new Date(r.submittedAt).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—';
      return `<tr>
        <td>${d.label}</td>
        <td style="text-align:center;font-weight:700;color:${r.pct>=70?'#16a34a':'#dc2626'}">${r.pct}%</td>
        <td style="text-align:center">${r.score}/${r.total}</td>
        <td style="text-align:center;font-weight:700;color:${r.pct>=70?'#16a34a':'#dc2626'}">${r.pct>=70?'Pass':'Fail'}</td>
        <td style="text-align:center;color:#666">${dt}</td>
      </tr>`;
    }).join('');

    const certRowsHtml = s.certs.map(c => {
      const dt = c.uploadedAt ? new Date(c.uploadedAt).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—';
      return `<tr><td>${c.certName||'Document'}</td><td style="text-align:center">${c.fileType||'—'}</td><td style="text-align:center">${dt}</td></tr>`;
    }).join('');

    const assignments = a.assignments || [];
    const scores = a.scores || {};
    const quizRowsHtml = assignments.map(asn => {
      const val = (scores[s.id]||{})[asn.id];
      if (val === undefined || val === null) return '';
      return `<tr><td>${asn.name||asn.id}</td><td style="text-align:center">${val}</td><td style="text-align:center">${asn.maxScore||'—'}</td></tr>`;
    }).join('');

    return `
      <div class="student-card">
        <div class="student-header">
          <div>
            <div class="student-name">${s.name}</div>
            <div class="student-meta">Student ID: ${s.tfdId||s.id}</div>
          </div>
          <div class="student-badge ${s.overall!==null&&s.overall>=70?'pass':'fail'}">
            ${s.overall!==null ? s.overall+'% — '+(s.overall>=70?'Pass':'Did Not Pass') : 'No grades on file'}
          </div>
        </div>
        <div class="two-col">
          <div>
            <div class="section-label">Attendance</div>
            <div class="stat-row">
              <span>Present: <strong style="color:#16a34a">${s.present}</strong></span>
              <span>Absent: <strong style="color:#dc2626">${s.absent}</strong></span>
              <span>Late: <strong style="color:#d97706">${s.late}</strong></span>
              <span>Total: <strong>${s.totalDays}</strong> days</span>
            </div>
          </div>
        </div>
        ${examRowsHtml ? `
        <div class="section-label" style="margin-top:14px">Exam Results</div>
        <table><thead><tr><th>Exam</th><th>Score</th><th>Points</th><th>Status</th><th>Date</th></tr></thead>

async function fetchAsBase64DataURI(url) {
  try {
    const resp = await fetch(url);
    if (!resp.ok) return null;
    const blob = await resp.blob();
    return await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload  = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  } catch(e) { console.warn('fetchAsBase64DataURI failed:', url, e); return null; }
}

async function downloadStudentAuditPackage(archiveId, studentId) {
  const archives = await loadArchives();
  const a = archives.find(x => x.id === archiveId);
  if (!a) return;
  const s = (a.students||[]).find(x => x.id === studentId);
  if (!s) return;
  const examDefs = Object.values(EXAM_DEFS).flat();
  const html = await generateStudentAuditHTML(s, a, examDefs);
  const safeName = s.name.replace(/[^a-z0-9]/gi,'_');
  const blob = new Blob([html], {type:'text/html'});
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `TFD_Audit_${safeName}_${a.className.replace(/[^a-z0-9]/gi,'_')}.html`;
  link.click();
  URL.revokeObjectURL(url);
}

async function generateAuditPackages(archiveId) {
  const archives = await loadArchives();
  const a = archives.find(x => x.id === archiveId);
  if (!a) return;
  const students = a.students || [];
  if (students.length === 0) { alert('No students in this archive.'); return; }
  const examDefs = Object.values(EXAM_DEFS).flat();
  if (!confirm(`Generate audit packages for all ${students.length} students in "${a.className}"?\n\nThis will download one HTML file per student. Proceed?`)) return;
  const progressEl = document.createElement('div');
  progressEl.style.cssText = 'position:fixed;bottom:20px;right:20px;background:#1e3a5f;color:#fff;padding:14px 20px;border-radius:10px;font-size:13px;z-index:9999;min-width:260px;box-shadow:0 8px 24px rgba(0,0,0,0.3)';
  progressEl.innerHTML = `<div style="font-weight:700;margin-bottom:6px">Generating audit packages…</div><div id="auditProgress">0/${students.length}</div>`;
  document.body.appendChild(progressEl);
  for (let i = 0; i < students.length; i++) {
    const s = students[i];
    document.getElementById('auditProgress').textContent = `${i+1}/${students.length} — ${s.name}`;
    const html = await generateStudentAuditHTML(s, a, examDefs);
    const safeName = s.name.replace(/[^a-z0-9]/gi,'_');
    const fileName = `TFD_Audit_${safeName}_${a.className.replace(/[^a-z0-9]/gi,'_')}.html`;
    const blob = new Blob([html], {type:'text/html'});
    const dlUrl = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = dlUrl; link.download = fileName; link.click();
    URL.revokeObjectURL(dlUrl);
    await new Promise(r => setTimeout(r, 600));
  }
  document.body.removeChild(progressEl);
  setSyncStatus('saved', `✓ ${students.length} audit packages downloaded`);
  setTimeout(()=>setSyncStatus('',''), 3000);
}


async function deleteArchive(id, docName, className) {
  if (!confirm(`Permanently delete archive for "${className}"?\nThis cannot be undone.`)) return;
  try {
    const resp = await fetch(`https://firestore.googleapis.com/v1/${docName}?key=${FB_CONFIG.apiKey}`, {method:'DELETE'});
    if (!resp.ok) throw new Error(await resp.text());
    setSyncStatus('saved', '✓ Archive deleted');
    setTimeout(()=>setSyncStatus('',''), 2000);
    if (archiveDetailId === id) archiveDetailId = null;
    renderArchives();
  } catch(e) {
    alert('Delete failed: ' + e.message);
  }
}

  if (typeof storage === 'undefined' || !storage) {
    alert('Firebase Storage is not available. Make sure the Storage SDK is loaded and Firebase Storage is enabled in your project.');
    return;
  }

  const progressEl = document.getElementById('docUploadProgress');
  const barEl      = document.getElementById('docUploadBar');
  const statusEl   = document.getElementById('docUploadStatus');
  progressEl.style.display = 'block';
  statusEl.textContent = 'Uploading…';

  try {
    // Sanitize filename and build storage path
    const ext = file.name.split('.').pop().toLowerCase();
    const safeName = _docUploadStudentName.replace(/[^a-z0-9]/gi, '_').toLowerCase();
    const safeLabel = label.replace(/[^a-z0-9]/gi, '_').toLowerCase();
    const timestamp = Date.now();
    const storagePath = `student_docs/${safeName}/${safeLabel}_${timestamp}.${ext}`;

    // Upload to Firebase Storage with progress
    const storageRef = storage.ref(storagePath);
    const uploadTask = storageRef.put(file);

    await new Promise((resolve, reject) => {
      uploadTask.on('state_changed',
        snapshot => {
          const pct = Math.round((snapshot.bytesTransferred / snapshot.totalBytes) * 100);
          barEl.style.width = pct + '%';
          statusEl.textContent = `Uploading… ${pct}%`;
        },
        reject,
        resolve
      );
    });

    statusEl.textContent = 'Getting download URL…';
    const downloadUrl = await storageRef.getDownloadURL();

    // Save record to Firestore certificates collection
    statusEl.textContent = 'Saving record…';
    const fileType = ['pdf'].includes(ext) ? 'pdf' : 'image';
    const body = {
      fields: {
        studentName: { stringValue: _docUploadStudentName },
        certName:    { stringValue: label },
        downloadUrl: { stringValue: downloadUrl },
        fileType:    { stringValue: fileType },
        uploadedAt:  { stringValue: new Date().toISOString() },
        storagePath: { stringValue: storagePath },
        docType:     { stringValue: 'document' },
      }
    };
    const resp = await fetch(
      `https://firestore.googleapis.com/v1/projects/${FB_CONFIG.projectId}/databases/(default)/documents/certificates?key=${FB_CONFIG.apiKey}`,
      { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) }
    );
    if (!resp.ok) throw new Error(await resp.text());

    barEl.style.width = '100%';
    statusEl.textContent = 'Upload complete ✓';
    setSyncStatus('saved', '✓ Document uploaded');
    setTimeout(() => setSyncStatus('', ''), 2500);

    // Refresh the cert list on that student card
    if (_docUploadCardEl) {
      const existing = _docUploadCardEl.querySelector('[data-certs]');
      if (existing) existing.remove();
      await loadStudentCertsForSummary(_docUploadStudentName, _docUploadCardEl);
    }

    setTimeout(closeDocUploadModal, 800);
  } catch(e) {
    console.error('Upload error:', e);
    let msg = e.message || String(e);
    if (msg.includes('storage/unauthorized') || msg.includes('permission') || msg.includes('403')) {
      msg = 'Upload failed — Firebase Storage rules are blocking this upload. In the Firebase Console go to Storage → Rules and allow writes to student_docs/.';
    } else if (msg.includes('storage/unknown') || msg.includes('CORS')) {
      msg = 'Upload failed — Storage may not be enabled for this project. Enable Firebase Storage in the Firebase Console.';
    } else if (!window.storage || typeof window.storage === 'undefined') {
      msg = 'Upload failed — Firebase Storage SDK not loaded. Check your internet connection.';
    }
    statusEl.textContent = msg;
    barEl.style.background = '#dc2626';
    setSyncStatus('error', '✗ Upload failed');
  }
}

// Close modal on backdrop click
document.addEventListener('DOMContentLoaded', () => {
  const modal = document.getElementById('docUploadModal');
  if (modal) {
    modal.addEventListener('click', e => {
      if (e.target === modal) closeDocUploadModal();
    });
  }
});

</script>
</body>
</html>
